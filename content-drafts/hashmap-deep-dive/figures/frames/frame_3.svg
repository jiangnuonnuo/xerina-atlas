      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs><rect width="1200" height="640" fill="#F8FAFC"/><text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1E293B">HashMap 扩容（resize）动画演示</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#64748B">阈值 = 旧容量翻倍　·　新数组准备就位，开始迁移元素</text>
  <rect x="20" y="84" width="1160" height="36" rx="10" fill="#EEF2FF"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#6366F1">步骤 ③</text>
  <text x="120" y="108" font-size="14" fill="#1E293B">扩容判定：newCap = 4 &lt;&lt; 1 = 8，newThr = 8 × 0.75 = 6</text><text x="90" y="146" font-size="14" font-weight="700" fill="#6366F1">旧数组（容量 4）</text><text x="440" y="146" font-size="12" fill="#64748B">oldCap=4, oldThr=3</text><g><rect x="90" y="160" width="100" height="200" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="140.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#94A3B8">桶 0</text><line x1="98" y1="192" x2="182" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="140.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="205" y="160" width="100" height="200" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="255.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#94A3B8">桶 1</text><line x1="213" y1="192" x2="297" y2="192" stroke="#E2E8F0" stroke-width="1"/><g opacity="0.45"><rect x="213" y="279.0" width="84" height="26" rx="6" fill="#10B981"/><text x="255.0" y="297.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">k=1</text></g></g><g><rect x="320" y="160" width="100" height="200" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="370.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#94A3B8">桶 2</text><line x1="328" y1="192" x2="412" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="370.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="435" y="160" width="100" height="200" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="485.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#94A3B8">桶 3</text><line x1="443" y1="192" x2="527" y2="192" stroke="#E2E8F0" stroke-width="1"/><g opacity="0.45"><rect x="443" y="249.0" width="84" height="26" rx="6" fill="#10B981"/><text x="485.0" y="267.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">k=3</text></g><line x1="485.0" y1="276.0" x2="485.0" y2="277.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/><g opacity="0.45"><rect x="443" y="279.0" width="84" height="26" rx="6" fill="#10B981"/><text x="485.0" y="297.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">k=7</text></g><line x1="485.0" y1="306.0" x2="485.0" y2="307.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/><g opacity="0.45"><rect x="443" y="309.0" width="84" height="26" rx="6" fill="#10B981"/><text x="485.0" y="327.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">k=15</text></g></g><text x="620" y="146" font-size="14" font-weight="700" fill="#10B981">新数组（容量 8）</text><text x="750" y="146" font-size="12" fill="#64748B">newCap=8, newThr=6</text><g><rect x="620" y="160" width="58" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="649.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 0</text><line x1="628" y1="192" x2="670" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="649.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="684" y="160" width="58" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="713.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 1</text><line x1="692" y1="192" x2="734" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="713.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="748" y="160" width="58" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="777.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 2</text><line x1="756" y1="192" x2="798" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="777.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="812" y="160" width="58" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="841.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 3</text><line x1="820" y1="192" x2="862" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="841.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="876" y="160" width="58" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="905.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 4</text><line x1="884" y1="192" x2="926" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="905.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="940" y="160" width="58" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="969.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 5</text><line x1="948" y1="192" x2="990" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="969.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="1004" y="160" width="58" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="1033.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 6</text><line x1="1012" y1="192" x2="1054" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="1033.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="1068" y="160" width="58" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="1097.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 7</text><line x1="1076" y1="192" x2="1118" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="1097.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g opacity="0.55"><text x="595" y="260" text-anchor="middle" font-size="22" fill="#F59E0B">→</text></g><rect x="60" y="430" width="1080" height="48" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="460" font-size="14" fill="#1E293B"><tspan font-weight="700">扩容规则：</tspan>　新容量 = 旧容量 × 2　·　新阈值 = 新容量 × loadFactor（0.75）</text><rect x="60" y="510" width="1080" height="100" rx="12" fill="#FFFBEB" stroke="#FDE68A"/><text x="84" y="538" font-size="13" font-weight="700" fill="#F59E0B">⚡ 这一帧要点</text><text x="84" y="566" font-size="13" fill="#1E293B">新容量直接 = 旧容量 × 2，所以一定是 2 的幂。新阈值 = 新容量 × loadFactor = 8 × 0.75 = 6。</text><text x="84" y="590" font-size="13" fill="#1E293B">扩容后桶下标只需要看「新增的那一位」：n-1 多了一位高位，原来同桶的元素会被拆到两个新桶。</text></svg>