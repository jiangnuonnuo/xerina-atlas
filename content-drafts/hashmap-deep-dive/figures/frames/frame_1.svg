<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs><rect width="1200" height="640" fill="#F8FAFC"/><text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1E293B">HashMap 扩容（resize）动画演示</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#64748B">table.length=4, loadFactor=0.75, threshold=3　·　准备插入新 key=15</text>
  <rect x="20" y="84" width="1160" height="36" rx="10" fill="#EEF2FF"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#6366F1">步骤 ①</text>
  <text x="120" y="108" font-size="14" fill="#1E293B">初始：旧数组容量 4，3 个元素，size = threshold = 3</text><text x="90" y="146" font-size="14" font-weight="700" fill="#6366F1">旧数组（容量 4）</text><text x="440" y="146" font-size="12" fill="#64748B">oldCap=4, oldThr=3</text><g><rect x="90" y="160" width="100" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="140.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 0</text><line x1="98" y1="192" x2="182" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="140.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="205" y="160" width="100" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="255.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 1</text><line x1="213" y1="192" x2="297" y2="192" stroke="#E2E8F0" stroke-width="1"/><g opacity="1"><rect x="213" y="279.0" width="84" height="26" rx="6" fill="#10B981"/><text x="255.0" y="297.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">k=1</text></g></g><g><rect x="320" y="160" width="100" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="370.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 2</text><line x1="328" y1="192" x2="412" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="370.0" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="435" y="160" width="100" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="485.0" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 3</text><line x1="443" y1="192" x2="527" y2="192" stroke="#E2E8F0" stroke-width="1"/><g opacity="1"><rect x="443" y="264.0" width="84" height="26" rx="6" fill="#10B981"/><text x="485.0" y="282.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">k=3</text></g><line x1="485.0" y1="291.0" x2="485.0" y2="292.0" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/><g opacity="1"><rect x="443" y="294.0" width="84" height="26" rx="6" fill="#10B981"/><text x="485.0" y="312.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">k=7</text></g></g><rect x="60" y="430" width="1080" height="48" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="460" font-size="14" fill="#1E293B"><tspan font-weight="700">数组状态：</tspan>　capacity=4, size=3, threshold=3　·　桶3 已有链表 [3→7]</text><rect x="60" y="510" width="1080" height="100" rx="12" fill="#FFFBEB" stroke="#FDE68A"/><text x="84" y="538" font-size="13" font-weight="700" fill="#F59E0B">⚡ 这一帧要点</text><text x="84" y="566" font-size="13" fill="#1E293B">table.length=4, loadFactor=0.75, threshold = 4 × 0.75 = 3。所以 size 一旦超过 3 就触发 resize。</text><text x="84" y="590" font-size="13" fill="#1E293B">注意：HashMap 的 table 数组是「懒加载」的，第一次 put 才创建，初始容量由构造器参数决定（默认 16）。</text></svg>