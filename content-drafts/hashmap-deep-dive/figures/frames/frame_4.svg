<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs><rect width="1200" height="640" fill="#F8FAFC"/><text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1E293B">HashMap 扩容（resize）动画演示</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#64748B">低4位就是 0001，新桶下标也是 1　·　hash 低位没变就不动</text>
  <rect x="20" y="84" width="1160" height="36" rx="10" fill="#EEF2FF"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#6366F1">步骤 ④</text>
  <text x="120" y="108" font-size="14" fill="#1E293B">迁移 k=1：1 &amp; 7 = 1 → 新桶 1（位置不变）</text><text x="90" y="146" font-size="14" font-weight="700" fill="#10B981">新数组（容量 8）</text><text x="220" y="146" font-size="12" fill="#64748B">newCap=8, newThr=6</text><g><rect x="79.0" y="160" width="125" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="141.5" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 0</text><line x1="87.0" y1="192" x2="196.0" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="141.5" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="210.0" y="160" width="125" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="272.5" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 1</text><line x1="218.0" y1="192" x2="327.0" y2="192" stroke="#E2E8F0" stroke-width="1"/><g opacity="1"><rect x="218.0" y="279.0" width="109" height="26" rx="6" fill="#FBBF24"/><text x="272.5" y="297.0" text-anchor="middle" font-size="13" font-weight="700" fill="#7C2D12">k=1</text></g></g><g><rect x="341.0" y="160" width="125" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="403.5" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 2</text><line x1="349.0" y1="192" x2="458.0" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="403.5" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="472.0" y="160" width="125" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="534.5" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 3</text><line x1="480.0" y1="192" x2="589.0" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="534.5" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="603.0" y="160" width="125" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="665.5" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 4</text><line x1="611.0" y1="192" x2="720.0" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="665.5" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="734.0" y="160" width="125" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="796.5" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 5</text><line x1="742.0" y1="192" x2="851.0" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="796.5" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="865.0" y="160" width="125" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="927.5" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 6</text><line x1="873.0" y1="192" x2="982.0" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="927.5" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><g><rect x="996.0" y="160" width="125" height="200" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="1058.5" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6366F1">桶 7</text><line x1="1004.0" y1="192" x2="1113.0" y2="192" stroke="#E2E8F0" stroke-width="1"/><text x="1058.5" y="232" text-anchor="middle" font-size="12" fill="#94A3B8">null</text></g><rect x="60" y="430" width="1080" height="48" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="460" font-size="14" fill="#1E293B"><tspan font-weight="700">迁移进度：</tspan>　1/4 完成　·　新桶 1 就位</text><rect x="60" y="510" width="1080" height="100" rx="12" fill="#FFFBEB" stroke="#FDE68A"/><text x="84" y="538" font-size="13" font-weight="700" fill="#F59E0B">⚡ 这一帧要点</text><text x="84" y="566" font-size="13" fill="#1E293B">k=1 的 hash 低 4 位是 0001，新桶容量 8 时 (n-1)=7=0111，1 &amp; 7 = 1，位置不变。</text><text x="84" y="590" font-size="13" fill="#1E293B">迁移策略：JDK 1.8 不是从头 rehash 每个 key，而是看新增的那一位是 0 还是 1，分到低位桶或高位桶。</text></svg>