<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1290" viewBox="0 0 1200 1290" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="1290" fill="#F8FAFC"/>
  <text x="600" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#1E293B">put(key, value) 一次完整流程</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#64748B">面试常问：从「计算位置」到「可能触发扩容」，JDK 1.8 的全链路</text>
  <line x1="60" y1="112" x2="1140" y2="112" stroke="#E2E8F0" stroke-width="2"/>

  <!-- ============ 阶段1：计算位置 ============ -->
  <text x="64" y="150" font-size="18" font-weight="700" fill="#059669">阶段一 · 计算位置</text>

  <g transform="translate(64,170)">
    <rect width="1072" height="118" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="14.5" font-weight="700" fill="#1E293B">1. 扰动：h = key.hashCode() ^ (hashCode &gt;&gt;&gt; 16)</text>
    <text x="24" y="64" font-size="13.5" fill="#475569">高 16 位与低 16 位异或，把高位信息「混入」低位——定位只用低 n 位，</text>
    <text x="24" y="90" font-size="13.5" fill="#475569">不扰动的话高位不同的 key 会大面积撞桶，扰动后分布更均匀。</text>
    <rect x="680" y="18" width="370" height="82" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="698" y="44" font-size="13" font-weight="700" fill="#059669">hashCode 相等 ≠ key 相等</text>
    <text x="698" y="70" font-size="12.5" fill="#475569">定位用 hashCode，命中后还要用</text>
    <text x="698" y="90" font-size="12.5" fill="#475569">equals() 判断 key 是否真的相等</text>
  </g>

  <line x1="600" y1="288" x2="600" y2="318" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(64,322)">
    <rect width="1072" height="108" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="14.5" font-weight="700" fill="#1E293B">2. 定位：index = (n - 1) &amp; h　（n = 数组长度，恒为 2 的幂）</text>
    <text x="24" y="64" font-size="13.5" fill="#475569">位与等价于 h % n，但更快。n-1 的二进制全是低位 1，直接截取 hash 的</text>
    <text x="24" y="90" font-size="13.5" fill="#475569">低 log2(n) 位作桶下标。这也是扩容后下标「只变一位」的原因。</text>
    <rect x="680" y="16" width="370" height="74" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="698" y="42" font-size="13" font-weight="700" fill="#4F46E5">例：n=16, h=25(11001)</text>
    <text x="698" y="66" font-size="12.5" font-family="monospace" fill="#3730A3">25 &amp; 15 = 11001 &amp; 01111</text>
    <text x="698" y="86" font-size="12.5" font-family="monospace" fill="#3730A3">= 01001 = 9 → 放进桶 9</text>
  </g>

  <!-- ============ 阶段2：插入 ============ -->
  <line x1="600" y1="430" x2="600" y2="460" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="64" y="492" font-size="18" font-weight="700" fill="#4F46E5">阶段二 · 桶内插入</text>

  <g transform="translate(64,510)">
    <rect width="1072" height="112" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="14.5" font-weight="700" fill="#1E293B">3. 桶是空的？</text>
    <g transform="translate(190,14)">
      <rect width="158" height="62" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
      <text x="79" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4F46E5">是 → new Node</text>
      <text x="79" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">直接插入，无冲突 O(1)</text>
    </g>
    <g transform="translate(364,14)">
      <rect width="158" height="62" rx="10" fill="#FFFBEB" stroke="#F59E0B"/>
      <text x="79" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B45309">否 → 有冲突</text>
      <text x="79" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">继续判断桶内结构</text>
    </g>
    <rect x="548" y="14" width="500" height="82" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="566" y="42" font-size="12.5" fill="#475569">注意：table 数组是懒加载的，第一次 put 时</text>
    <text x="566" y="64" font-size="12.5" fill="#475569">才用 newCap=16、newThr=12 初始化。</text>
    <text x="566" y="86" font-size="12.5" fill="#94A3B8">resize() 同时承担「初始化」和「扩容」两种职责</text>
  </g>

  <line x1="600" y1="622" x2="600" y2="652" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(64,656)">
    <rect width="1072" height="112" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="14.5" font-weight="700" fill="#1E293B">4. 桶内首节点是 TreeNode（红黑树）？</text>
    <g transform="translate(300,14)">
      <rect width="168" height="62" rx="10" fill="#FEF2F2" stroke="#EF4444"/>
      <text x="84" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#DC2626">是 → putTreeVal()</text>
      <text x="84" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">红黑树插入 O(log n)</text>
    </g>
    <g transform="translate(484,14)">
      <rect width="168" height="62" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
      <text x="84" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4F46E5">否 → 遍历链表</text>
      <text x="84" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">逐个比较 key</text>
    </g>
  </g>

  <line x1="600" y1="768" x2="600" y2="798" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(64,802)">
    <rect width="1072" height="112" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="14.5" font-weight="700" fill="#1E293B">5. 链表里找到 key 相等的节点（equals 判断）？</text>
    <g transform="translate(300,14)">
      <rect width="168" height="62" rx="10" fill="#FEF2F2" stroke="#EF4444"/>
      <text x="84" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#DC2626">是 → 覆盖旧 value</text>
      <text x="84" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">只换 value，返回旧值</text>
    </g>
    <g transform="translate(484,14)">
      <rect width="168" height="62" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
      <text x="84" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4F46E5">否 → 尾插新节点</text>
      <text x="84" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">JDK 1.7 是头插，1.8 改尾插</text>
    </g>
    <rect x="680" y="14" width="368" height="82" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="698" y="42" font-size="12.5" font-weight="700" fill="#B45309">为什么 1.8 改尾插？</text>
    <text x="698" y="64" font-size="12.5" fill="#475569">1.7 头插在并发扩容时可能形成</text>
    <text x="698" y="86" font-size="12.5" fill="#475569">环形链表，get 陷入死循环</text>
  </g>

  <line x1="600" y1="914" x2="600" y2="944" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>

  <g transform="translate(64,948)">
    <rect width="1072" height="112" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="14.5" font-weight="700" fill="#1E293B">6. 尾插后链表长度 ≥ 8？</text>
    <g transform="translate(300,14)">
      <rect width="200" height="62" rx="10" fill="#FEF2F2" stroke="#EF4444"/>
      <text x="100" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#DC2626">是 → treeifyBin()</text>
      <text x="100" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">容量≥64 转红黑树，否则先扩容</text>
    </g>
    <g transform="translate(516,14)">
      <rect width="158" height="62" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
      <text x="79" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4F46E5">否 → 保持链表</text>
      <text x="79" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">继续下一步</text>
    </g>
    <rect x="700" y="14" width="348" height="82" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="718" y="42" font-size="12.5" fill="#475569">树化是「两个条件」：链表长度 ≥ 8</text>
    <text x="718" y="64" font-size="12.5" fill="#475569">且数组容量 ≥ 64，二者缺一不可。</text>
    <text x="718" y="86" font-size="12.5" fill="#94A3B8">容量不足时，先扩容把链表拆散</text>
  </g>

  <!-- ============ 阶段3：扩容 ============ -->
  <line x1="600" y1="1060" x2="600" y2="1090" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="64" y="1122" font-size="18" font-weight="700" fill="#B45309">阶段三 · 扩容检查</text>

  <g transform="translate(64,1140)">
    <rect width="1072" height="112" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="14.5" font-weight="700" fill="#1E293B">7. size + 1 &gt; threshold ？（threshold = 容量 × 0.75）</text>
    <g transform="translate(300,14)">
      <rect width="200" height="62" rx="10" fill="#FFFBEB" stroke="#F59E0B"/>
      <text x="100" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B45309">是 → resize()</text>
      <text x="100" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">容量翻倍，元素重新哈希迁移</text>
    </g>
    <g transform="translate(516,14)">
      <rect width="158" height="62" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
      <text x="79" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4F46E5">否 → 插入完成</text>
      <text x="79" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">直接返回</text>
    </g>
    <rect x="700" y="14" width="348" height="82" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="718" y="42" font-size="12.5" font-weight="700" fill="#B45309">返回值的讲究</text>
    <text x="718" y="64" font-size="12.5" fill="#475569">覆盖旧 key 时返回旧 value，</text>
    <text x="718" y="86" font-size="12.5" fill="#475569">新插入返回 null（可判重）</text>
  </g>

  <line x1="600" y1="1252" x2="600" y2="1268" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="460" y="1270" width="280" height="20" rx="10" fill="#EEF2FF"/>
</svg>
