<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366F1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#F8FAFC"/>
  <!-- 标题区 -->
  <text x="600" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#1E293B">HashMap 底层结构（JDK 1.8）</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#64748B">散列表 = 数组（桶） + 链表 + 红黑树 · 数组默认初始容量 16，装载因子 0.75</text>
  <line x1="60" y1="112" x2="1140" y2="112" stroke="#E2E8F0" stroke-width="2"/>

  <!-- 数组区域 -->
  <text x="64" y="150" font-size="18" font-weight="700" fill="#6366F1">① Node&lt;K,V&gt;[] table —— 桶数组</text>

  <!-- 桶 0..7 -->
  <g font-size="15" font-weight="600">
    <g transform="translate(64,170)">
      <rect width="120" height="96" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
      <text x="60" y="56" text-anchor="middle" fill="#6366F1">null</text>
      <text x="60" y="86" text-anchor="middle" font-size="12" fill="#64748B">index 0</text>
    </g>
    <g transform="translate(200,170)">
      <rect width="120" height="96" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
      <text x="60" y="56" text-anchor="middle" fill="#6366F1">null</text>
      <text x="60" y="86" text-anchor="middle" font-size="12" fill="#64748B">index 1</text>
    </g>
    <g transform="translate(336,170)">
      <rect width="120" height="96" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
      <text x="60" y="46" text-anchor="middle" fill="#6366F1">hash 冲突</text>
      <text x="60" y="72" text-anchor="middle" fill="#6366F1">→ 链表</text>
      <text x="60" y="90" text-anchor="middle" font-size="11" fill="#64748B">index 2</text>
    </g>
    <g transform="translate(472,170)">
      <rect width="120" height="96" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
      <text x="60" y="46" text-anchor="middle" fill="#6366F1">冲突 ≥ 8</text>
      <text x="60" y="72" text-anchor="middle" fill="#6366F1">→ 红黑树</text>
      <text x="60" y="90" text-anchor="middle" font-size="11" fill="#64748B">index 3</text>
    </g>
    <g transform="translate(608,170)">
      <rect width="120" height="96" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
      <text x="60" y="56" text-anchor="middle" fill="#6366F1">null</text>
      <text x="60" y="86" text-anchor="middle" font-size="12" fill="#64748B">index 4</text>
    </g>
    <g transform="translate(744,170)">
      <rect width="120" height="96" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
      <text x="60" y="46" text-anchor="middle" fill="#6366F1">hash 冲突</text>
      <text x="60" y="72" text-anchor="middle" fill="#6366F1">→ 链表</text>
      <text x="60" y="90" text-anchor="middle" font-size="11" fill="#64748B">index 5</text>
    </g>
    <g transform="translate(880,170)">
      <rect width="120" height="96" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
      <text x="60" y="56" text-anchor="middle" fill="#6366F1">null</text>
      <text x="60" y="86" text-anchor="middle" font-size="12" fill="#64748B">index 6</text>
    </g>
    <g transform="translate(1016,170)">
      <rect width="120" height="96" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
      <text x="60" y="46" text-anchor="middle" fill="#6366F1">hash 冲突</text>
      <text x="60" y="72" text-anchor="middle" fill="#6366F1">→ 链表</text>
      <text x="60" y="90" text-anchor="middle" font-size="11" fill="#64748B">index 7</text>
    </g>
  </g>

  <text x="64" y="308" font-size="14" fill="#64748B">定位公式：<tspan font-family="monospace" fill="#0F766E">index = (n - 1) &amp; hash(key)</tspan>　（等价于取模，但位运算更快；n 恒为 2 的幂）</text>

  <!-- 分界线 -->
  <line x1="60" y1="336" x2="1140" y2="336" stroke="#E2E8F0" stroke-width="2"/>

  <!-- 三个展开区 -->
  <text x="64" y="370" font-size="18" font-weight="700" fill="#6366F1">② 桶内两种形态 —— 冲突少是链表，冲突多了变红黑树</text>

  <!-- 区1：空桶 -->
  <g>
    <rect x="64" y="392" width="340" height="330" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <rect x="64" y="392" width="340" height="46" rx="16" fill="#EEF2FF"/>
    <rect x="64" y="420" width="340" height="18" fill="#EEF2FF"/>
    <text x="234" y="422" text-anchor="middle" font-size="16" font-weight="700" fill="#6366F1">空桶</text>
    <text x="234" y="468" text-anchor="middle" font-size="13" fill="#64748B">没有哈希冲突，直接存放</text>
    <g transform="translate(150,500)">
      <rect width="168" height="72" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="6 5"/>
      <text x="84" y="32" text-anchor="middle" font-size="14" fill="#94A3B8">node = null</text>
      <text x="84" y="56" text-anchor="middle" font-size="12" fill="#94A3B8">(懒初始化，put 时才创建)</text>
    </g>
    <text x="234" y="650" text-anchor="middle" font-size="13" fill="#64748B">table 数组初始不分配，</text>
    <text x="234" y="674" text-anchor="middle" font-size="13" fill="#64748B">首次 put 时才 new 出来</text>
  </g>

  <!-- 区2：链表 -->
  <g>
    <rect x="430" y="392" width="340" height="330" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <rect x="430" y="392" width="340" height="46" rx="16" fill="#ECFDF5"/>
    <rect x="430" y="420" width="340" height="18" fill="#ECFDF5"/>
    <text x="600" y="422" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">链表（hash 冲突 &lt; 8）</text>
    <text x="600" y="468" text-anchor="middle" font-size="13" fill="#64748B">冲突的 key 串成单向链表，JDK 1.8 起尾部插入</text>
    <g transform="translate(452,492)">
      <g transform="translate(0,0)">
        <rect width="88" height="66" rx="10" fill="#10B981"/>
        <text x="44" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">k1</text>
        <text x="44" y="50" text-anchor="middle" font-size="12" fill="#D1FAE5">v1</text>
      </g>
      <line x1="92" y1="33" x2="118" y2="33" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
      <g transform="translate(120,0)">
        <rect width="88" height="66" rx="10" fill="#10B981"/>
        <text x="44" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">k2</text>
        <text x="44" y="50" text-anchor="middle" font-size="12" fill="#D1FAE5">v2</text>
      </g>
      <line x1="212" y1="33" x2="238" y2="33" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
      <g transform="translate(240,0)">
        <rect width="88" height="66" rx="10" fill="#10B981"/>
        <text x="44" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">k3</text>
        <text x="44" y="50" text-anchor="middle" font-size="12" fill="#D1FAE5">v3</text>
      </g>
      <line x1="332" y1="33" x2="348" y2="33" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
      <text x="358" y="38" font-size="13" fill="#94A3B8">…</text>
    </g>
    <g transform="translate(452,584)">
      <rect x="0" y="0" width="296" height="118" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="148" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Node&lt;K,V&gt; 节点结构</text>
      <g font-size="12" fill="#475569">
        <text x="20" y="52">int    hash</text>
        <text x="20" y="72">K      key</text>
        <text x="20" y="92">V      value</text>
        <text x="20" y="112">Node   next</text>
      </g>
      <text x="170" y="52" font-size="11" fill="#94A3B8">哈希值（扰动后）</text>
      <text x="170" y="72" font-size="11" fill="#94A3B8">键（equals 判断相等）</text>
      <text x="170" y="92" font-size="11" fill="#94A3B8">值</text>
      <text x="170" y="112" font-size="11" fill="#94A3B8">后继指针</text>
    </g>
  </g>

  <!-- 区3：红黑树 -->
  <g>
    <rect x="796" y="392" width="340" height="330" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <rect x="796" y="392" width="340" height="46" rx="16" fill="#FEF2F2"/>
    <rect x="796" y="420" width="340" height="18" fill="#FEF2F2"/>
    <text x="966" y="422" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">红黑树（冲突 ≥ 8）</text>
    <text x="966" y="468" text-anchor="middle" font-size="13" fill="#64748B">查找从 O(n) 降到 O(log n)</text>
    <g transform="translate(824,492)">
      <!-- 根 黑 -->
      <circle cx="142" cy="22" r="24" fill="#1E293B"/>
      <text x="142" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">R</text>
      <!-- 左 红 -->
      <line x1="128" y1="42" x2="62" y2="78" stroke="#64748B" stroke-width="2"/>
      <line x1="156" y1="42" x2="222" y2="78" stroke="#64748B" stroke-width="2"/>
      <circle cx="62" cy="86" r="20" fill="#EF4444"/>
      <text x="62" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">R</text>
      <!-- 右 黑 -->
      <circle cx="222" cy="86" r="20" fill="#1E293B"/>
      <text x="222" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">B</text>
    </g>
    <g transform="translate(796,584)">
      <rect x="0" y="0" width="340" height="118" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="170" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">树化条件（两个都要满足）</text>
      <g font-size="12.5" fill="#475569">
        <text x="24" y="56">① 链表长度 ≥ 8</text>
        <text x="24" y="80">② 数组容量 ≥ 64</text>
        <text x="24" y="104">③ 容量不够时先 resize() 扩容</text>
      </g>
      <g font-size="11.5" fill="#94A3B8">
        <text x="240" y="56">(TREEIFY_THRESHOLD)</text>
        <text x="240" y="80">(MIN_TREEIFY_CAPACITY)</text>
      </g>
    </g>
  </g>

  <!-- 底部注释 -->
  <line x1="60" y1="748" x2="1140" y2="748" stroke="#E2E8F0" stroke-width="2"/>
  <text x="600" y="778" text-anchor="middle" font-size="13.5" fill="#94A3B8">去树化：扩容时若红黑树节点 ≤ 6，退化为链表（UNTREEIFY_THRESHOLD） · 树里仍存 Node 的 next 指针，方便退化</text>
</svg>
