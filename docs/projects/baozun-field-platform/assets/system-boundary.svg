<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827} .muted{fill:#6b7280} .small{font-size:12px} .title{font-size:23px;font-weight:700} .node{font-size:14px;font-weight:600}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="260" fill="#ffffff"/>
<text x="40" y="38" class="title">字段目录平台系统边界</text>
<text x="40" y="62" class="small muted">平台承接页面证据、目录治理和字典交付，不修改被采集业务系统。</text>
<rect x="42" y="90" width="1116" height="120" rx="12" fill="#f8fafc" fill-opacity="0.45" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7,5"/>
<text x="58" y="115" font-size="13" font-weight="700" fill="#94a3b8">端到端边界</text>
<rect x="75" y="120" width="290" height="65" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="220.0" y="150" text-anchor="middle" class="node">被采集业务系统</text>
<text x="220.0" y="171" text-anchor="middle" class="small muted">页面与交互状态</text>
<rect x="455" y="120" width="290" height="65" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="600.0" y="150" text-anchor="middle" class="node">字段目录平台</text>
<text x="600.0" y="171" text-anchor="middle" class="small muted">解析、治理、版本、交付</text>
<rect x="835" y="120" width="290" height="65" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="980.0" y="150" text-anchor="middle" class="node">下游使用方</text>
<text x="980.0" y="171" text-anchor="middle" class="small muted">业务 / 数据 / 治理系统</text>
<line x1="365" y1="152" x2="455" y2="152" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="376.0" y="129" width="68" height="20" rx="4" fill="#fff" opacity="0.96"/>
<text x="410" y="144" text-anchor="middle" class="small muted">字段证据</text>
<line x1="745" y1="152" x2="835" y2="152" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="756.0" y="129" width="68" height="20" rx="4" fill="#fff" opacity="0.96"/>
<text x="790" y="144" text-anchor="middle" class="small muted">字段字典</text>
</svg>