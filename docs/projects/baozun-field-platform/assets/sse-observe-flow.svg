<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827} .muted{fill:#6b7280} .small{font-size:12px} .title{font-size:23px;font-weight:700} .node{font-size:14px;font-weight:600}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="290" fill="#ffffff"/>
<text x="40" y="38" class="title">解析任务与 SSE 观察通道</text>
<text x="40" y="62" class="small muted">任务状态和观察连接分离，连接断开不影响后台解析。</text>
<rect x="106.5" y="130" width="175" height="76" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="194.0" y="160" text-anchor="middle" class="node">POST 创建任务</text>
<text x="194.0" y="181" text-anchor="middle" class="small muted">返回 parseTaskId</text>
<line x1="281.5" y1="168" x2="309.5" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="309.5" y="130" width="175" height="76" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="397.0" y="160" text-anchor="middle" class="node">GET /events</text>
<text x="397.0" y="181" text-anchor="middle" class="small muted">建立 SSE</text>
<line x1="484.5" y1="168" x2="512.5" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="512.5" y="130" width="175" height="76" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2.2"/>
<rect x="516.5" y="134" width="167" height="68" rx="7" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.55"/>
<text x="600.0" y="160" text-anchor="middle" class="node">步骤事件</text>
<text x="600.0" y="181" text-anchor="middle" class="small muted">节点与字段增量</text>
<line x1="687.5" y1="168" x2="715.5" y2="168" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<rect x="715.5" y="130" width="175" height="76" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="803.0" y="160" text-anchor="middle" class="node">连接断开</text>
<text x="803.0" y="181" text-anchor="middle" class="small muted">任务继续运行</text>
<line x1="890.5" y1="168" x2="918.5" y2="168" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" data-graph-role="edge"/>
<rect x="918.5" y="130" width="175" height="76" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="1006.0" y="160" text-anchor="middle" class="node">重连恢复</text>
<text x="1006.0" y="181" text-anchor="middle" class="small muted">状态 + lastEventId</text>
</svg>