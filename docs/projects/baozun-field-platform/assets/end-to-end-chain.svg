<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827} .muted{fill:#6b7280} .small{font-size:12px} .title{font-size:23px;font-weight:700} .node{font-size:14px;font-weight:600}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="290" fill="#ffffff"/>
<text x="40" y="38" class="title">页面到目录的端到端链路</text>
<text x="40" y="62" class="small muted">字段从页面证据进入目录，再以字典和变化集持续交付。</text>
<rect x="45.0" y="130" width="160" height="76" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="125.0" y="160" text-anchor="middle" class="node">页面</text>
<text x="125.0" y="181" text-anchor="middle" class="small muted">菜单 / 页签 / 字段 / 指标</text>
<line x1="205.0" y1="168" x2="235.0" y2="168" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" data-graph-role="edge"/>
<rect x="235.0" y="130" width="160" height="76" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="315.0" y="160" text-anchor="middle" class="node">DOM-SCOUT 采证</text>
<text x="315.0" y="181" text-anchor="middle" class="small muted">页面证据</text>
<line x1="395.0" y1="168" x2="425.0" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="425.0" y="130" width="160" height="76" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2.2"/>
<rect x="429.0" y="134" width="152" height="68" rx="7" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.55"/>
<text x="505.0" y="160" text-anchor="middle" class="node">FieldTreeDraft</text>
<text x="505.0" y="181" text-anchor="middle" class="small muted">Agent 解析</text>
<line x1="585.0" y1="168" x2="615.0" y2="168" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<rect x="615.0" y="130" width="160" height="76" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="695.0" y="160" text-anchor="middle" class="node">字段目录</text>
<text x="695.0" y="181" text-anchor="middle" class="small muted">结构不变量</text>
<line x1="775.0" y1="168" x2="805.0" y2="168" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="805.0" y="130" width="160" height="76" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="885.0" y="160" text-anchor="middle" class="node">字段字典</text>
<text x="885.0" y="181" text-anchor="middle" class="small muted">快照 + 异步导出</text>
<line x1="965.0" y1="168" x2="995.0" y2="168" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" data-graph-role="edge"/>
<rect x="995.0" y="130" width="160" height="76" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2.2"/>
<rect x="999.0" y="134" width="152" height="68" rx="7" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.55"/>
<text x="1075.0" y="160" text-anchor="middle" class="node">长青资产</text>
<text x="1075.0" y="181" text-anchor="middle" class="small muted">再采集 + 变化审核</text>
</svg>
