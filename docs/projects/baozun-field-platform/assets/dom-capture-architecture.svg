<rect x="664" y="144" width="432" height="72" rx="7" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.55"/>
<text x="880.0" y="170" text-anchor="middle" class="node-title">Agent + Playwright</text>
<text x="880.0" y="191" text-anchor="middle" class="small muted">适用于结构简单、操作安全的开放页面</text>
<text x="880.0" y="209" text-anchor="middle" class="small muted">达到步骤或质量边界后停止</text>
<rect x="400" y="370" width="400" height="75" rx="10" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.5"/>
