<path d="M 600 445 L 600 485 L 260 485 L 260 555" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="352.0" y="465" width="166" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
