<rect width="1200" height="720" fill="#ffffff"/>
<text x="40" y="42" class="title">DOM-SCOUT 半智能字段采集架构</text>
<text x="40" y="67" class="subtitle muted">Field DOM Scout 负责人工选区与自动清洗；简化 DomSnapshot 进入内部 Agent；Playwright 只提供受限加速。</text>
