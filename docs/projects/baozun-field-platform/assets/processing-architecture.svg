<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827} .muted{fill:#6b7280} .small{font-size:12px} .title{font-size:23px;font-weight:700} .node{font-size:14px;font-weight:600}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="920" fill="#ffffff"/>
<text x="40" y="38" class="title">字段平台业务处理架构</text>
<text x="40" y="62" class="small muted">人工或自动入口产生证据，解析、审核、发布和交付在平台内部形成可回放链路。</text>
<rect x="365" y="90" width="470" height="62" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="600.0" y="120" text-anchor="middle" class="node">人工框选 / DOM 扫描 / 缩进文本导入</text>
<text x="600.0" y="141" text-anchor="middle" class="small muted">采集入口</text>
<line x1="600" y1="152" x2="600" y2="178" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="415" y="180" width="370" height="62" rx="10" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="600.0" y="210" text-anchor="middle" class="node">Field Evidence Snapshot</text>
<text x="600.0" y="231" text-anchor="middle" class="small muted">页面结构、语义和来源证据</text>
<line x1="505" y1="242" x2="350" y2="275" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<line x1="695" y1="242" x2="850" y2="275" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<rect x="180" y="275" width="340" height="62" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="350.0" y="305" text-anchor="middle" class="node">确定性规则解析</text>
<text x="350.0" y="326" text-anchor="middle" class="small muted">可直接判断的字段和结构</text>
<rect x="680" y="275" width="340" height="62" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2.2"/>
<rect x="684" y="279" width="332" height="54" rx="7" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.55"/>
<text x="850.0" y="305" text-anchor="middle" class="node">局部歧义 Agent 推断</text>
<text x="850.0" y="326" text-anchor="middle" class="small muted">名称、类型和父级候选</text>
<line x1="520" y1="306" x2="680" y2="306" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<rect x="566.0" y="283" width="68" height="20" rx="4" fill="#fff" opacity="0.96"/>
<text x="600" y="298" text-anchor="middle" class="small muted">候选合并</text>
<line x1="600" y1="337" x2="600" y2="365" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="390" y="365" width="420" height="62" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="600.0" y="395" text-anchor="middle" class="node">Candidate Tree + Confidence</text>
<text x="600.0" y="416" text-anchor="middle" class="small muted">可解释的候选字段树</text>
<line x1="600" y1="427" x2="600" y2="455" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" data-graph-role="edge"/>
<rect x="390" y="455" width="420" height="62" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="600.0" y="485" text-anchor="middle" class="node">结构校验 + 人工审核</text>
<text x="600.0" y="506" text-anchor="middle" class="small muted">质量门、反馈和修订</text>
<line x1="600" y1="517" x2="600" y2="545" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="390" y="545" width="420" height="62" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="600.0" y="575" text-anchor="middle" class="node">Change Set + tree_version</text>
<text x="600.0" y="596" text-anchor="middle" class="small muted">相对正式目录的变化表达</text>
<line x1="600" y1="607" x2="600" y2="635" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="390" y="635" width="420" height="62" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="600.0" y="665" text-anchor="middle" class="node">事务化发布</text>
<text x="600.0" y="686" text-anchor="middle" class="small muted">邻接关系与闭包关系同事务</text>
<line x1="600" y1="697" x2="600" y2="725" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="390" y="725" width="420" height="62" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="600.0" y="755" text-anchor="middle" class="node">邻接表 + 闭包表目录模型</text>
<text x="600.0" y="776" text-anchor="middle" class="small muted">MySQL 正式目录</text>
<line x1="600" y1="787" x2="600" y2="815" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" data-graph-role="edge"/>
<rect x="270" y="815" width="270" height="62" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="405.0" y="845" text-anchor="middle" class="node">MySQL 快照 + SQLite 工作区</text>
<text x="405.0" y="866" text-anchor="middle" class="small muted">交付前的一致性处理</text>
<rect x="660" y="815" width="270" height="62" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="795.0" y="845" text-anchor="middle" class="node">SXSSF 流式字段字典</text>
<text x="795.0" y="866" text-anchor="middle" class="small muted">下载交付物</text>
<line x1="540" y1="846" x2="660" y2="846" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
</svg>