<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827} .muted{fill:#6b7280} .small{font-size:12px} .title{font-size:23px;font-weight:700} .node{font-size:14px;font-weight:600}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="500" fill="#ffffff"/>
<text x="40" y="38" class="title">自适应缩进批量建树</text>
<text x="40" y="62" class="small muted">前端先归一和预览缩进，再向服务端提交嵌套命令。</text>
<rect x="60" y="105" width="300" height="260" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="210.0" y="135" text-anchor="middle" class="node">原始文本</text>
<text x="210.0" y="156" text-anchor="middle" class="small muted">交易管理</text>
<text x="210.0" y="173" text-anchor="middle" class="small muted">  订单管理</text>
<text x="210.0" y="190" text-anchor="middle" class="small muted">    订单编号</text>
<text x="210.0" y="207" text-anchor="middle" class="small muted">    订单金额</text>
<text x="210.0" y="224" text-anchor="middle" class="small muted">  售后管理</text>
<text x="210.0" y="241" text-anchor="middle" class="small muted">    退款金额</text>
<line x1="360" y1="235" x2="450" y2="235" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="350.0" y="210" width="110" height="20" rx="4" fill="#fff" opacity="0.96"/>
<text x="405" y="225" text-anchor="middle" class="small muted">归一 / 校验</text>
<rect x="450" y="105" width="300" height="260" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="600.0" y="135" text-anchor="middle" class="node">归一预览</text>
<text x="600.0" y="156" text-anchor="middle" class="small muted">交易管理</text>
<text x="600.0" y="173" text-anchor="middle" class="small muted">  订单管理</text>
<text x="600.0" y="190" text-anchor="middle" class="small muted">    订单编号</text>
<text x="600.0" y="207" text-anchor="middle" class="small muted">    订单金额</text>
<text x="600.0" y="224" text-anchor="middle" class="small muted">  售后管理</text>
<text x="600.0" y="241" text-anchor="middle" class="small muted">    退款金额</text>
<line x1="750" y1="235" x2="840" y2="235" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="761.0" y="210" width="68" height="20" rx="4" fill="#fff" opacity="0.96"/>
<text x="795" y="225" text-anchor="middle" class="small muted">嵌套命令</text>
<rect x="840" y="105" width="300" height="260" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="990.0" y="135" text-anchor="middle" class="node">服务端建树</text>
<text x="990.0" y="156" text-anchor="middle" class="small muted">父子关系</text>
<text x="990.0" y="173" text-anchor="middle" class="small muted">名称唯一</text>
<text x="990.0" y="190" text-anchor="middle" class="small muted">最大深度</text>
<text x="990.0" y="207" text-anchor="middle" class="small muted">节点数量</text>
<text x="990.0" y="224" text-anchor="middle" class="small muted">错误行号</text>
<text x="990.0" y="241" text-anchor="middle" class="small muted">事务提交</text>
<text x="600" y="430" text-anchor="middle" class="small muted">解析错误定位到原始行号；前端预览不等于正式目录写入。</text>
</svg>