<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827} .muted{fill:#6b7280} .small{font-size:12px} .title{font-size:23px;font-weight:700} .node{font-size:14px;font-weight:600}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="290" fill="#ffffff"/>
<text x="40" y="38" class="title">Agent 解析到正式保存</text>
<text x="40" y="62" class="small muted">解析、预览和修订都只改变草稿；显式保存才触发目录事务。</text>
<rect x="42.5" y="130" width="165" height="76" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="125.0" y="160" text-anchor="middle" class="node">DomSnapshot</text>
<text x="125.0" y="181" text-anchor="middle" class="small muted">输入契约</text>
<line x1="207.5" y1="168" x2="232.5" y2="168" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="232.5" y="130" width="165" height="76" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2.2"/>
<rect x="236.5" y="134" width="157" height="68" rx="7" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.55"/>
<text x="315.0" y="160" text-anchor="middle" class="node">Agent 工作流</text>
<text x="315.0" y="181" text-anchor="middle" class="small muted">低代码节点流转</text>
<line x1="397.5" y1="168" x2="422.5" y2="168" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<rect x="422.5" y="130" width="165" height="76" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="505.0" y="160" text-anchor="middle" class="node">FieldDraft</text>
<text x="505.0" y="181" text-anchor="middle" class="small muted">结构化草稿</text>
<line x1="587.5" y1="168" x2="612.5" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="612.5" y="130" width="165" height="76" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2.2"/>
<rect x="616.5" y="134" width="157" height="68" rx="7" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.55"/>
<text x="695.0" y="160" text-anchor="middle" class="node">SSE 预览</text>
<text x="695.0" y="181" text-anchor="middle" class="small muted">增量结果</text>
<line x1="777.5" y1="168" x2="802.5" y2="168" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<rect x="802.5" y="130" width="165" height="76" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="885.0" y="160" text-anchor="middle" class="node">对话 / 直接编辑</text>
<text x="885.0" y="181" text-anchor="middle" class="small muted">版本化修订</text>
<line x1="967.5" y1="168" x2="992.5" y2="168" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" data-graph-role="edge"/>
<rect x="992.5" y="130" width="165" height="76" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="1075.0" y="160" text-anchor="middle" class="node">显式保存</text>
<text x="1075.0" y="181" text-anchor="middle" class="small muted">正式目录事务</text>
</svg>