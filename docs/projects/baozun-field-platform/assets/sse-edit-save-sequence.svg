<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" width="1200" height="1100">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827} .muted{fill:#6b7280} .small{font-size:12px} .label{font-size:14px} .title{font-size:24px;font-weight:700} .subtitle{font-size:13px} .node-title{font-size:14px;font-weight:600}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="1100" fill="#ffffff"/>
<text x="40" y="42" class="title">DOM 解析、SSE 修订与显式保存时序</text>
<text x="40" y="67" class="subtitle muted">SSE 只负责观察解析过程；对话和保存使用普通请求；正式数据库只在提交阶段发生写入。</text>
<rect x="35" y="92" width="150" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="110" y="124" text-anchor="middle" font-size="14" font-weight="600">用户 / 插件</text>
<line x1="110" y1="144" x2="110" y2="1040" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="255" y="92" width="150" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="330" y="124" text-anchor="middle" font-size="14" font-weight="600">采集对话框</text>
<line x1="330" y1="144" x2="330" y2="1040" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="495" y="92" width="150" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="570" y="124" text-anchor="middle" font-size="14" font-weight="600">Spring Boot</text>
<line x1="570" y1="144" x2="570" y2="1040" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="745" y="92" width="150" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="820" y="124" text-anchor="middle" font-size="14" font-weight="600">内部 Agent 平台</text>
<line x1="820" y1="144" x2="820" y2="1040" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="1005" y="92" width="150" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1080" y="124" text-anchor="middle" font-size="14" font-weight="600">MySQL</text>
<line x1="1080" y1="144" x2="1080" y2="1040" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="30" y="165" width="1140" height="400" rx="10" fill="#eff6ff" fill-opacity="0.35" stroke="#93c5fd" stroke-dasharray="7,5"/>
<text x="45" y="188" font-size="13" font-weight="700" fill="#2563eb">阶段一 · 解析并预览</text>
<rect x="30" y="585" width="1140" height="245" rx="10" fill="#faf5ff" fill-opacity="0.35" stroke="#c084fc" stroke-dasharray="7,5"/>
<text x="45" y="608" font-size="13" font-weight="700" fill="#9333ea">阶段二 · 对话与直接编辑</text>
<rect x="30" y="850" width="1140" height="190" rx="10" fill="#f0fdf4" fill-opacity="0.45" stroke="#4ade80" stroke-dasharray="7,5"/>
<text x="45" y="873" font-size="13" font-weight="700" fill="#16a34a">阶段三 · 用户显式保存</text>
<line x1="110" y1="220" x2="322" y2="220" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="220.0" y="212" text-anchor="middle" class="small">选择局部 DOM</text>
<line x1="330" y1="265" x2="562" y2="265" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="450.0" y="257" text-anchor="middle" class="small">POST 创建解析任务</text>
<line x1="570" y1="310" x2="812" y2="310" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="695.0" y="302" text-anchor="middle" class="small">启动 workflowInstance</text>
<line x1="570" y1="355" x2="338" y2="355" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="450.0" y="347" text-anchor="middle" class="small">返回 taskId</text>
<line x1="330" y1="400" x2="562" y2="400" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="450.0" y="392" text-anchor="middle" class="small">GET /events（SSE）</text>
<line x1="820" y1="445" x2="578" y2="445" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<text x="695.0" y="437" text-anchor="middle" class="small">节点事件 / 字段增量</text>
<line x1="570" y1="490" x2="338" y2="490" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<text x="450.0" y="482" text-anchor="middle" class="small">FIELD_UPSERT</text>
<line x1="820" y1="520" x2="578" y2="520" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
<text x="695.0" y="512" text-anchor="middle" class="small">DRAFT_READY</text>
<line x1="570" y1="548" x2="338" y2="548" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
<text x="450.0" y="540" text-anchor="middle" class="small">完整字段草稿</text>
<line x1="110" y1="640" x2="322" y2="640" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="220.0" y="632" text-anchor="middle" class="small">输入修改指令</text>
<line x1="330" y1="685" x2="562" y2="685" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="450.0" y="677" text-anchor="middle" class="small">POST message + draftVersion</text>
<line x1="570" y1="730" x2="812" y2="730" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="695.0" y="722" text-anchor="middle" class="small">执行修订分支</text>
<line x1="820" y1="760" x2="578" y2="760" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<text x="695.0" y="752" text-anchor="middle" class="small">领域操作 Patch</text>
<line x1="570" y1="792" x2="338" y2="792" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<text x="450.0" y="784" text-anchor="middle" class="small">校验后应用 Patch</text>
<line x1="110" y1="820" x2="322" y2="820" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
<text x="220.0" y="812" text-anchor="middle" class="small">也可直接编辑字段树</text>
<line x1="110" y1="905" x2="322" y2="905" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="220.0" y="897" text-anchor="middle" class="small">点击保存</text>
<line x1="330" y1="945" x2="562" y2="945" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="450.0" y="937" text-anchor="middle" class="small">POST commit + treeVersion</text>
<line x1="570" y1="985" x2="1072" y2="985" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
<text x="825.0" y="977" text-anchor="middle" class="small">事务写入目录与闭包表</text>
<line x1="1080" y1="1025" x2="338" y2="1025" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
<text x="705.0" y="1017" text-anchor="middle" class="small">返回新 treeVersion</text>
<line x1="50" y1="1075" x2="82" y2="1075" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="92" y="1079" class="small muted">同步请求</text>
<line x1="186" y1="1075" x2="218" y2="1075" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<text x="228" y="1079" class="small muted">SSE / Agent结果</text>
<line x1="448" y1="1075" x2="480" y2="1075" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="490" y="1079" class="small muted">正式持久化</text>
</svg>
