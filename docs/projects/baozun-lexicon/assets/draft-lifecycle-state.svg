<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827} .muted{fill:#6b7280} .small{font-size:12px} .label{font-size:14px} .title{font-size:24px;font-weight:700} .subtitle{font-size:13px} .node-title{font-size:14px;font-weight:600}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="40" y="42" class="title">字段草稿状态机与数据库边界</text>
<text x="40" y="67" class="subtitle muted">解析、追加和修改都发生在临时工作副本中；只有 COMMIT 成功才进入正式字段目录。</text>
<rect x="40" y="100" width="930" height="540" rx="12" fill="#eff6ff" fill-opacity="0.45" stroke="#93c5fd" stroke-width="1.4" stroke-dasharray="7,5"/>
<text x="56" y="125" font-size="13" font-weight="700" fill="#93c5fd">临时工作区：服务端草稿 / 前端缓存 / Agent 上下文</text>
<rect x="1000" y="100" width="160" height="540" rx="12" fill="#f0fdf4" fill-opacity="0.45" stroke="#4ade80" stroke-width="1.4" stroke-dasharray="7,5"/>
<text x="1016" y="125" font-size="13" font-weight="700" fill="#4ade80">正式目录</text>
<circle cx="80" cy="220" r="9" fill="#111827"/>
<path d="M 89 220 L 130 220" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<path d="M 270 220 L 320 220" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="247.0" y="195" width="96" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="295" y="210" text-anchor="middle" class="small muted">接收证据</text>
<path d="M 460 220 L 510 220" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="437.0" y="195" width="96" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="485" y="210" text-anchor="middle" class="small muted">SSE 草稿</text>
<path d="M 660 220 L 710 220" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<rect x="651.0" y="195" width="68" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="685" y="210" text-anchor="middle" class="small muted">确认结果</text>
<path d="M 860 220 L 875 220" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="834.0" y="195" width="68" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="868" y="210" text-anchor="middle" class="small muted">点击保存</text>
<path d="M 970 220 L 1020 220" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="961.0" y="195" width="68" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="995" y="210" text-anchor="middle" class="small muted">事务提交</text>
<path d="M 580 265 L 580 390" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)" data-graph-role="edge"/>
<rect x="593.0" y="315" width="82" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="634" y="330" text-anchor="middle" class="small muted">缺少上下文</text>
<path d="M 505 430 L 390 430 L 390 265" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<rect x="347.0" y="407" width="166" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="430" y="422" text-anchor="middle" class="small muted">追加证据后重解析</text>
<path d="M 785 265 L 785 390" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<rect x="796.0" y="315" width="68" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="830" y="330" text-anchor="middle" class="small muted">对话修改</text>
<path d="M 710 430 L 680 430 L 680 265" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<rect x="588.0" y="407" width="124" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="650" y="422" text-anchor="middle" class="small muted">应用 Patch</text>
<path d="M 925 265 L 925 530 L 785 530 L 785 470" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)" data-graph-role="edge"/>
<rect x="793.0" y="507" width="124" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="855" y="522" text-anchor="middle" class="small muted">校验失败返回编辑</text>
<rect x="130" y="180" width="140" height="85" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="200.0" y="210" text-anchor="middle" class="node-title">DRAFT_CREATED</text>
<text x="200.0" y="231" text-anchor="middle" class="small muted">创建临时草稿</text>
<rect x="320" y="180" width="140" height="85" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2.2"/>
<rect x="324" y="184" width="132" height="77" rx="7" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.55"/>
<text x="390.0" y="210" text-anchor="middle" class="node-title">PARSING</text>
<text x="390.0" y="231" text-anchor="middle" class="small muted">工作流运行中</text>
<rect x="510" y="180" width="150" height="85" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="585.0" y="210" text-anchor="middle" class="node-title">PREVIEW_READY</text>
<text x="585.0" y="231" text-anchor="middle" class="small muted">字段树可预览</text>
<rect x="710" y="180" width="150" height="85" rx="10" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
<text x="785.0" y="210" text-anchor="middle" class="node-title">EDITING</text>
<text x="785.0" y="231" text-anchor="middle" class="small muted">直接修改草稿</text>
<rect x="875" y="180" width="95" height="85" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="922.5" y="210" text-anchor="middle" class="node-title">VALIDATE</text>
<text x="922.5" y="231" text-anchor="middle" class="small muted">服务端</text>
<rect x="1020" y="180" width="120" height="85" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="1080.0" y="210" text-anchor="middle" class="node-title">COMMITTED</text>
<text x="1080.0" y="231" text-anchor="middle" class="small muted">新 treeVersion</text>
<rect x="505" y="390" width="150" height="80" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
<text x="580.0" y="420" text-anchor="middle" class="node-title">PARTIAL_REVIEW</text>
<text x="580.0" y="441" text-anchor="middle" class="small muted">保留候选，提示补充选区</text>
<rect x="710" y="390" width="150" height="80" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2.2"/>
<rect x="714" y="394" width="142" height="72" rx="7" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.55"/>
<text x="785.0" y="420" text-anchor="middle" class="node-title">CORRECTING</text>
<text x="785.0" y="441" text-anchor="middle" class="small muted">Agent 生成操作</text>
<circle cx="1080" cy="600" r="13" fill="none" stroke="#16a34a" stroke-width="2"/>
<circle cx="1080" cy="600" r="8" fill="#16a34a"/>
<path d="M 1080 265 L 1080 579" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<text x="505" y="690" class="small muted">草稿可以反复追加 DOM、对话修订和人工编辑，正式目录在保存前保持不变。</text>
<line x1="55" y1="720" x2="87" y2="720" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="97" y="724" class="small muted">解析与追加</text>
<line x1="205" y1="720" x2="237" y2="720" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<text x="247" y="724" class="small muted">草稿修订</text>
<line x1="341" y1="720" x2="373" y2="720" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="383" y="724" class="small muted">显式提交</text>
<line x1="477" y1="720" x2="509" y2="720" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
<text x="519" y="724" class="small muted">校验/证据反馈</text>
</svg>
