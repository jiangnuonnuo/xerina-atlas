<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="70" y="70" fill="#4338ca" font-size="22" font-weight="600">Cordis 内核：插件树而非「特权核心」</text>

  <!-- core -->
  <circle cx="480" cy="430" r="60" fill="url(#core)"/>
  <text x="480" y="424" fill="#fff" font-size="15" text-anchor="middle" font-weight="600">Cordis</text>
  <text x="480" y="446" fill="#e0e7ff" font-size="12" text-anchor="middle">加载/卸载/解析</text>

  <!-- branches -->
  <line x1="480" y1="370" x2="200" y2="250" stroke="#94a3b8" stroke-width="3"/>
  <line x1="480" y1="370" x2="400" y2="230" stroke="#94a3b8" stroke-width="3"/>
  <line x1="480" y1="370" x2="640" y2="230" stroke="#94a3b8" stroke-width="3"/>
  <line x1="480" y1="370" x2="820" y2="250" stroke="#94a3b8" stroke-width="3"/>

  <rect x="130" y="200" width="140" height="64" rx="12" fill="#6366f1"/>
  <text x="200" y="230" fill="#fff" font-size="14" text-anchor="middle">工具插件</text>
  <text x="200" y="250" fill="#e0e7ff" font-size="11" text-anchor="middle">tools</text>

  <rect x="330" y="180" width="140" height="64" rx="12" fill="#06b6d4"/>
  <text x="400" y="210" fill="#fff" font-size="14" text-anchor="middle">UI 插件</text>
  <text x="400" y="230" fill="#cffafe" font-size="11" text-anchor="middle">slots</text>

  <rect x="570" y="180" width="140" height="64" rx="12" fill="#10b981"/>
  <text x="640" y="210" fill="#fff" font-size="14" text-anchor="middle">会话插件</text>
  <text x="640" y="230" fill="#d1fae5" font-size="11" text-anchor="middle">sessions</text>

  <rect x="750" y="200" width="150" height="64" rx="12" fill="#f59e0b"/>
  <text x="825" y="230" fill="#fff" font-size="14" text-anchor="middle">业务插件</text>
  <text x="825" y="250" fill="#fef3c7" font-size="11" text-anchor="middle">我的宠物</text>

  <text x="70" y="510" fill="#64748b" font-size="15">内核不承载能力，真正干活的都来自这棵插件树上的节点</text>
</svg>
