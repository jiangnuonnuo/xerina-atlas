<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="70" y="70" fill="#4338ca" font-size="22" font-weight="600">Trajectory：仅追加的会话黑匣子</text>

  <!-- main timeline -->
  <line x1="120" y1="320" x2="820" y2="320" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="120" cy="320" r="12" fill="#6366f1"/>
  <circle cx="280" cy="320" r="12" fill="#6366f1"/>
  <circle cx="440" cy="320" r="12" fill="#6366f1"/>
  <circle cx="600" cy="320" r="12" fill="#6366f1"/>
  <circle cx="760" cy="320" r="12" fill="#6366f1"/>

  <text x="110" y="360" fill="#64748b" font-size="13">启动</text>
  <text x="270" y="360" fill="#64748b" font-size="13">意图</text>
  <text x="430" y="360" fill="#64748b" font-size="13">思考</text>
  <text x="590" y="360" fill="#64748b" font-size="13">工具</text>
  <text x="750" y="360" fill="#64748b" font-size="13">交付</text>

  <!-- branch upward from node 3 -->
  <path d="M440 308 C 440 220, 560 200, 600 200" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <circle cx="600" cy="200" r="9" fill="#22d3ee"/>
  <text x="500" y="180" fill="#0e7490" font-size="14">分叉（从某节点另起一条线）</text>

  <!-- replay loop from end back to node 2 -->
  <path d="M760 332 C 760 460, 280 460, 280 332" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="430" y="492" fill="#047857" font-size="14">回放 / 恢复（从轨迹末尾接着跑）</text>

  <text x="70" y="510" fill="#64748b" font-size="15">只追加、不覆盖 → 可恢复、可分叉、可回放，便于调试与审计</text>
</svg>
