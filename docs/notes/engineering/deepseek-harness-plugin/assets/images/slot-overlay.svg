<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="pet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="70" y="70" fill="#4338ca" font-size="22" font-weight="600">插槽扩展点：把 UI 挂到宿主预留的悬浮层</text>

  <!-- page -->
  <rect x="80" y="100" width="640" height="400" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="80" y="100" width="640" height="50" rx="18" fill="#f1f5f9"/>
  <circle cx="112" cy="125" r="6" fill="#f87171"/>
  <circle cx="134" cy="125" r="6" fill="#fbbf24"/>
  <circle cx="156" cy="125" r="6" fill="#34d399"/>
  <!-- page content -->
  <rect x="116" y="180" width="280" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="116" y="210" width="400" height="14" rx="7" fill="#eef2f7"/>
  <rect x="116" y="240" width="340" height="14" rx="7" fill="#eef2f7"/>
  <rect x="116" y="290" width="200" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- reserved slot (overlay) highlighted -->
  <rect x="80" y="100" width="640" height="400" rx="18" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="116" y="160" width="200" height="22" rx="11" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/>
  <text x="216" y="176" fill="#0e7490" font-size="12" text-anchor="middle">宿主预留插槽 shell.overlay</text>

  <!-- mounted plugin UI card -->
  <rect x="470" y="330" width="170" height="120" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" opacity="0.98"/>
  <circle cx="555" cy="372" r="26" fill="url(#pet)"/>
  <rect x="500" y="408" width="110" height="12" rx="6" fill="#e0e7ff"/>
  <rect x="500" y="428" width="80" height="10" rx="5" fill="#eef2f7"/>
  <text x="555" y="462" fill="#4338ca" font-size="11" text-anchor="middle">slots.register('xerina-pet')</text>

  <!-- arrow from slot to card -->
  <path d="M316 171 C 420 171, 430 360, 470 372" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="80" y="524" fill="#64748b" font-size="13">插件用 slots.register 挂载，带顺序控制；浮在内容之上、不挡交互</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>
</svg>
