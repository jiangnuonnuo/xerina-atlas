<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="70" y="70" fill="#5b21b6" font-size="22" font-weight="600">能力接缝：可替换、可迁移的执行环境</text>

  <!-- center capability -->
  <rect x="410" y="230" width="140" height="90" rx="14" fill="url(#core)"/>
  <text x="480" y="270" fill="#fff" font-size="15" text-anchor="middle" font-weight="600">插件能力</text>
  <text x="480" y="294" fill="#ede9fe" font-size="12" text-anchor="middle">filesystem / subprocess</text>

  <!-- socket left -->
  <rect x="356" y="262" width="22" height="26" rx="4" fill="#a855f7"/>
  <!-- socket right -->
  <rect x="582" y="262" width="22" height="26" rx="4" fill="#a855f7"/>

  <!-- local backend -->
  <rect x="120" y="220" width="200" height="110" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="160" y="250" width="120" height="14" rx="7" fill="#e0e7ff"/>
  <rect x="160" y="278" width="90" height="14" rx="7" fill="#e0e7ff"/>
  <circle cx="180" cy="320" r="14" fill="#818cf8"/>
  <rect x="206" y="312" width="90" height="16" rx="8" fill="#c7d2fe"/>
  <text x="220" y="338" fill="#4338ca" font-size="13">本地运行时</text>

  <!-- remote backend -->
  <rect x="640" y="220" width="200" height="110" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  <path d="M700 300 a22 14 0 0 1 44 0 a22 14 0 0 1 -44 0 Z" fill="#5eead4"/>
  <rect x="756" y="246" width="60" height="12" rx="6" fill="#ccfbf1"/>
  <rect x="756" y="270" width="44" height="12" rx="6" fill="#ccfbf1"/>
  <text x="740" y="338" fill="#0f766e" font-size="13">远端运行时</text>

  <!-- connect lines -->
  <line x1="378" y1="275" x2="410" y2="275" stroke="#a855f7" stroke-width="3"/>
  <line x1="550" y1="275" x2="582" y2="275" stroke="#a855f7" stroke-width="3"/>

  <!-- swap arrows -->
  <path d="M360 400 C 360 430, 600 430, 600 400" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="430" y="468" fill="#047857" font-size="14">替换后端实现 → 能力从本地迁到远端，业务插件零改动</text>

  <text x="70" y="510" fill="#64748b" font-size="15">provider/consumer 边界解耦：同一套能力，背后实现可换</text>
</svg>
