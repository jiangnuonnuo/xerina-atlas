<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="mod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#bg)"/>

  <!-- left: composable base -->
  <text x="120" y="80" fill="#4338ca" font-size="22" font-weight="600">底座：可拼装</text>
  <!-- socket base -->
  <rect x="120" y="420" width="300" height="40" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="150" y="404" width="20" height="20" rx="4" fill="#6366f1"/>
  <rect x="220" y="404" width="20" height="20" rx="4" fill="#6366f1"/>
  <rect x="290" y="404" width="20" height="20" rx="4" fill="#6366f1"/>
  <rect x="360" y="404" width="20" height="20" rx="4" fill="#6366f1"/>
  <!-- blocks -->
  <rect x="146" y="320" width="100" height="84" rx="10" fill="url(#mod)"/>
  <rect x="266" y="320" width="100" height="84" rx="10" fill="#22d3ee"/>
  <rect x="206" y="236" width="100" height="84" rx="10" fill="#34d399"/>
  <rect x="256" y="152" width="100" height="84" rx="10" fill="#f59e0b"/>
  <text x="160" y="368" fill="#fff" font-size="13">工具</text>
  <text x="288" y="368" fill="#fff" font-size="13">UI</text>
  <text x="222" y="284" fill="#fff" font-size="13">会话</text>
  <text x="272" y="200" fill="#fff" font-size="13">业务</text>

  <!-- VS -->
  <circle cx="480" cy="280" r="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="480" y="290" fill="#64748b" font-size="24" font-weight="700" text-anchor="middle">vs</text>

  <!-- right: closed product -->
  <text x="620" y="80" fill="#475569" font-size="22" font-weight="600">成品：已固化</text>
  <rect x="600" y="150" width="270" height="300" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="600" y="150" width="270" height="48" rx="18" fill="#cbd5e1"/>
  <text x="735" y="181" fill="#475569" font-size="15" text-anchor="middle" font-weight="600">Claude Code / Codex</text>
  <rect x="636" y="222" width="198" height="20" rx="10" fill="#cbd5e1"/>
  <rect x="636" y="258" width="198" height="20" rx="10" fill="#cbd5e1"/>
  <rect x="636" y="294" width="150" height="20" rx="10" fill="#cbd5e1"/>
  <!-- lock -->
  <rect x="718" y="350" width="34" height="26" rx="5" fill="#94a3b8"/>
  <path d="M724 350 v-8 a11 11 0 0 1 22 0 v8" fill="none" stroke="#94a3b8" stroke-width="5"/>
  <text x="735" y="430" fill="#64748b" font-size="14" text-anchor="middle">决策权在内部，不可改</text>

  <text x="120" y="510" fill="#64748b" font-size="16">左：决策权、能力组合权交还给你；右：减少你的决策</text>
</svg>
