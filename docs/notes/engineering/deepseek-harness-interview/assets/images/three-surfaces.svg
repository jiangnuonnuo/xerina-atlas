<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="70" y="72" fill="#4338ca" font-size="22" font-weight="600">三个表面：说话在左边，看东西在右边</text>

  <!-- ① 入口 -->
  <rect x="70" y="128" width="246" height="272" rx="16" fill="#6366f1"/>
  <circle cx="106" cy="170" r="22" fill="#ffffff" fill-opacity="0.18"/>
  <text x="106" y="177" fill="#ffffff" font-size="20" font-weight="600" text-anchor="middle">1</text>
  <text x="140" y="177" fill="#ffffff" font-size="19" font-weight="600">入口</text>
  <text x="98" y="216" fill="#e0e7ff" font-size="15">输入框右侧</text>
  <text x="98" y="242" fill="#ffffff" font-size="17" font-weight="600">「面试」按钮</text>
  <line x1="98" y1="264" x2="288" y2="264" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="98" y="296" fill="#c7d2fe" font-size="14">归属</text>
  <text x="98" y="320" fill="#ffffff" font-size="15">宿主插槽</text>
  <text x="98" y="352" fill="#c7d2fe" font-size="14">做什么</text>
  <text x="98" y="376" fill="#ffffff" font-size="15">点开面板</text>

  <!-- 箭头 1 -->
  <line x1="324" y1="264" x2="348" y2="264" stroke="#94a3b8" stroke-width="3"/>
  <path d="M340 256 L352 264 L340 272" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ② 考场对话 -->
  <rect x="356" y="128" width="246" height="272" rx="16" fill="#0ea5e9"/>
  <circle cx="392" cy="170" r="22" fill="#ffffff" fill-opacity="0.18"/>
  <text x="392" y="177" fill="#ffffff" font-size="20" font-weight="600" text-anchor="middle">2</text>
  <text x="426" y="177" fill="#ffffff" font-size="19" font-weight="600">面试官</text>
  <text x="384" y="216" fill="#e0f2fe" font-size="15">新开的那条对话</text>
  <text x="384" y="242" fill="#ffffff" font-size="17" font-weight="600">考场对话</text>
  <line x1="384" y1="264" x2="574" y2="264" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="384" y="296" fill="#bae6fd" font-size="14">归属</text>
  <text x="384" y="320" fill="#ffffff" font-size="15">宿主</text>
  <text x="384" y="352" fill="#bae6fd" font-size="14">做什么</text>
  <text x="384" y="376" fill="#ffffff" font-size="15">提问 · 追问 · 换题</text>

  <!-- 箭头 2：单向 -->
  <text x="622" y="248" fill="#059669" font-size="12" text-anchor="middle">单向</text>
  <line x1="610" y1="266" x2="634" y2="266" stroke="#10b981" stroke-width="3"/>
  <path d="M626 258 L638 266 L626 274" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ③ 教练面板 -->
  <rect x="642" y="128" width="246" height="272" rx="16" fill="#10b981"/>
  <circle cx="678" cy="170" r="22" fill="#ffffff" fill-opacity="0.18"/>
  <text x="678" y="177" fill="#ffffff" font-size="20" font-weight="600" text-anchor="middle">3</text>
  <text x="712" y="177" fill="#ffffff" font-size="19" font-weight="600">教练</text>
  <text x="670" y="216" fill="#d1fae5" font-size="15">本项目前端</text>
  <text x="670" y="242" fill="#ffffff" font-size="17" font-weight="600">右侧插件面板</text>
  <line x1="670" y1="264" x2="860" y2="264" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="670" y="296" fill="#a7f3d0" font-size="14">归属</text>
  <text x="670" y="320" fill="#ffffff" font-size="15">本插件</text>
  <text x="670" y="352" fill="#a7f3d0" font-size="14">做什么</text>
  <text x="670" y="376" fill="#ffffff" font-size="15">开卷 · 对照 · 五维</text>

  <text x="70" y="470" fill="#64748b" font-size="15">说话只在宿主输入框里，面板没有输入框、没有消息列表、没有气泡。</text>
  <text x="70" y="500" fill="#64748b" font-size="15">面板的东西绝不回流到考场。</text>
</svg>
