<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="70" y="72" fill="#4338ca" font-size="22" font-weight="600">一问一卡：追问新开卡，绝不覆写上一张</text>

  <!-- Q1 待作答 -->
  <rect x="70" y="150" width="164" height="216" rx="16" fill="#f59e0b"/>
  <text x="152" y="194" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">Q1</text>
  <rect x="94" y="208" width="116" height="26" rx="13" fill="#ffffff" fill-opacity="0.22"/>
  <text x="152" y="226" fill="#fffbeb" font-size="13" text-anchor="middle">待作答</text>
  <text x="94" y="272" fill="#fffbeb" font-size="14">题干</text>
  <text x="94" y="298" fill="#fffbeb" font-size="14">开卷要点</text>
  <text x="94" y="330" fill="#fde68a" font-size="14">对照 · 未生成</text>

  <!-- 箭头 1 -->
  <line x1="246" y1="266" x2="282" y2="266" stroke="#94a3b8" stroke-width="3"/>
  <path d="M274 258 L286 266 L274 274" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="264" y="242" fill="#64748b" font-size="13" text-anchor="middle">你作答</text>

  <!-- Q1 已评分 -->
  <rect x="298" y="150" width="164" height="216" rx="16" fill="#10b981"/>
  <text x="380" y="194" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">Q1</text>
  <rect x="322" y="208" width="116" height="26" rx="13" fill="#ffffff" fill-opacity="0.22"/>
  <text x="380" y="226" fill="#d1fae5" font-size="13" text-anchor="middle">已评分</text>
  <text x="322" y="272" fill="#d1fae5" font-size="14">作答</text>
  <text x="322" y="298" fill="#d1fae5" font-size="14">对照 · 已覆盖</text>
  <text x="322" y="330" fill="#a7f3d0" font-size="14">五维评分</text>

  <!-- 箭头 2 -->
  <line x1="474" y1="266" x2="510" y2="266" stroke="#6366f1" stroke-width="3"/>
  <path d="M502 258 L514 266 L502 274" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="492" y="242" fill="#4f46e5" font-size="13" text-anchor="middle">追问</text>

  <!-- Q1.1 -->
  <rect x="526" y="150" width="164" height="216" rx="16" fill="#6366f1"/>
  <text x="608" y="194" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">Q1.1</text>
  <rect x="550" y="208" width="116" height="26" rx="13" fill="#ffffff" fill-opacity="0.22"/>
  <text x="608" y="226" fill="#e0e7ff" font-size="13" text-anchor="middle">新开一张</text>
  <text x="550" y="272" fill="#e0e7ff" font-size="14">追问题独立成卡</text>
  <text x="550" y="298" fill="#e0e7ff" font-size="14">Q1 原样保留</text>
  <text x="550" y="330" fill="#c7d2fe" font-size="14">不会被冲掉</text>

  <!-- 箭头 3 -->
  <line x1="702" y1="266" x2="738" y2="266" stroke="#94a3b8" stroke-width="3"/>
  <path d="M730 258 L742 266 L730 274" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="720" y="242" fill="#64748b" font-size="13" text-anchor="middle">换点</text>

  <!-- Q2 -->
  <rect x="754" y="150" width="164" height="216" rx="16" fill="#0ea5e9"/>
  <text x="836" y="194" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">Q2</text>
  <rect x="778" y="208" width="116" height="26" rx="13" fill="#ffffff" fill-opacity="0.22"/>
  <text x="836" y="226" fill="#e0f2fe" font-size="13" text-anchor="middle">下一个</text>
  <text x="778" y="272" fill="#e0f2fe" font-size="14">换一个知识点</text>
  <text x="778" y="298" fill="#e0f2fe" font-size="14">继续由模型出题</text>

  <text x="70" y="426" fill="#64748b" font-size="15">评分只在后端算，前端只负责显示；没答的题不会编造分数。</text>
  <text x="70" y="456" fill="#64748b" font-size="15">左右滑动可以切回任意一张已答卡，题干、作答、对照、评分都在。</text>
  <text x="70" y="500" fill="#64748b" font-size="15">新题要点生成中会显示「正在生成本题」，旧卡不会白屏。</text>
</svg>
