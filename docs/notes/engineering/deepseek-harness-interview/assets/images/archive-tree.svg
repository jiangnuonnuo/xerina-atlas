<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="70" y="72" fill="#4338ca" font-size="22" font-weight="600">档案落在当前工作区：一问一节，纯 Markdown</text>

  <!-- 根节点 -->
  <rect x="70" y="116" width="286" height="52" rx="12" fill="#4338ca"/>
  <text x="98" y="148" fill="#ffffff" font-size="17" font-weight="600">.dsh-interview/</text>
  <text x="276" y="148" fill="#c7d2fe" font-size="13">当前工作区</text>

  <!-- 连线 -->
  <path d="M104 168 L104 190" stroke="#94a3b8" stroke-width="3"/>
  <path d="M104 190 L104 214" stroke="#94a3b8" stroke-width="3"/>

  <!-- 二级 -->
  <rect x="104" y="214" width="330" height="52" rx="12" fill="#6366f1"/>
  <text x="132" y="246" fill="#ffffff" font-size="16" font-weight="600">round-1-Redis-并发与缓存/</text>

  <!-- 连线到叶子 -->
  <path d="M138 266 L138 292" stroke="#94a3b8" stroke-width="3"/>
  <path d="M138 292 L138 316" stroke="#94a3b8" stroke-width="3"/>
  <path d="M138 292 L138 372" stroke="#94a3b8" stroke-width="3"/>
  <path d="M138 292 L138 428" stroke="#94a3b8" stroke-width="3"/>
  <path d="M138 316 L158 316" stroke="#94a3b8" stroke-width="3"/>
  <path d="M138 372 L158 372" stroke="#94a3b8" stroke-width="3"/>
  <path d="M138 428 L158 428" stroke="#94a3b8" stroke-width="3"/>

  <!-- 叶子 -->
  <rect x="158" y="292" width="330" height="48" rx="12" fill="#0ea5e9"/>
  <text x="186" y="321" fill="#ffffff" font-size="15">cards/ · Q1.md · Q1.1.md · Q2.md</text>

  <rect x="158" y="348" width="330" height="48" rx="12" fill="#10b981"/>
  <text x="186" y="377" fill="#ffffff" font-size="15">qa.md · 本轮问答汇总</text>

  <rect x="158" y="404" width="330" height="48" rx="12" fill="#10b981"/>
  <text x="186" y="433" fill="#ffffff" font-size="15">summary.md · 总结与建议</text>

  <!-- 右侧信息卡 -->
  <g>
    <rect x="540" y="116" width="350" height="96" rx="14" fill="#ffffff"/>
    <rect x="540" y="116" width="6" height="96" rx="3" fill="#f59e0b"/>
    <text x="568" y="152" fill="#111827" font-size="16" font-weight="600">纯 Markdown</text>
    <text x="568" y="182" fill="#64748b" font-size="14">没有 HTML 折叠、没有私有格式</text>
  </g>

  <g>
    <rect x="540" y="228" width="350" height="96" rx="14" fill="#ffffff"/>
    <rect x="540" y="228" width="6" height="96" rx="3" fill="#6366f1"/>
    <text x="568" y="264" fill="#111827" font-size="16" font-weight="600">一问一节，字段固定</text>
    <text x="568" y="294" fill="#64748b" font-size="14">题干 / 开卷 / 作答 / 对照 / 评分</text>
  </g>

  <g>
    <rect x="540" y="340" width="350" height="96" rx="14" fill="#ffffff"/>
    <rect x="540" y="340" width="6" height="96" rx="3" fill="#10b981"/>
    <text x="568" y="376" fill="#111827" font-size="16" font-weight="600">可拖走，也可切片</text>
    <text x="568" y="406" fill="#64748b" font-size="14">Obsidian 建双链，或切片入 RAG</text>
  </g>

  <text x="70" y="492" fill="#64748b" font-size="15">再开一轮会落进新的 round-2-… 目录，上一轮的文件一个字都不动。</text>
</svg>
