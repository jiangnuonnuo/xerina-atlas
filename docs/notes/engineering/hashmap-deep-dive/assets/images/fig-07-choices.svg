<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Microsoft JhengHei","SimHei",sans-serif}</style>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/></marker>
</defs>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="600.0" y="48" font-size="27px" fill="#111827" font-weight="700" text-anchor="middle">使用 HashMap 前，先把容量、key 和 Map 类型选对</text>
<text x="600.0" y="80" font-size="14px" fill="#6b7280" font-weight="400" text-anchor="middle">性能问题很多不是 HashMap 算法错，而是容量估计、可变 key、顺序需求或并发边界没有被说明</text>
<line x1="56" y1="104" x2="1144" y2="104" stroke="#d1d5db" stroke-width="2"/>
<rect x="64" y="140" width="500" height="556" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" data-graph-role="container"/>
<rect x="636" y="140" width="500" height="556" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" data-graph-role="container"/>
<text x="88" y="178" font-size="17px" fill="#2563eb" font-weight="700" text-anchor="start">容量与 key 的工程检查</text>
<text x="660" y="178" font-size="17px" fill="#16a34a" font-weight="700" text-anchor="start">根据语义选择 Map 实现</text>
<rect x="88" y="220" width="452" height="62" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="108" y="245" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">1. 预计元素数</text>
<text x="108" y="267" font-size="11.5px" fill="#6b7280" font-weight="400" text-anchor="start">ceil(expected / 0.75) 后向上取 2 的幂</text>
<rect x="88" y="308" width="452" height="62" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="108" y="333" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">2. 容量是懒加载的</text>
<text x="108" y="355" font-size="11.5px" fill="#6b7280" font-weight="400" text-anchor="start">构造器先记阈值，第一次 put 才分配 table</text>
<rect x="88" y="396" width="452" height="62" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="108" y="421" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">3. key 不要可变</text>
<text x="108" y="443" font-size="11.5px" fill="#6b7280" font-weight="400" text-anchor="start">参与 equals/hashCode 的字段改变后可能再也找不到</text>
<rect x="88" y="484" width="452" height="62" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="108" y="509" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">4. equals/hashCode 成对</text>
<text x="108" y="531" font-size="11.5px" fill="#6b7280" font-weight="400" text-anchor="start">equals 相等的 key 必须有相同 hashCode</text>
<rect x="88" y="572" width="452" height="62" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="108" y="597" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">5. 不要依赖遍历顺序</text>
<text x="108" y="619" font-size="11.5px" fill="#6b7280" font-weight="400" text-anchor="start">需要插入顺序用 LinkedHashMap</text>
<rect x="660" y="220" width="452" height="62" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="682" y="245" font-size="13px" fill="#16a34a" font-weight="700" text-anchor="start" font-family="monospace">HashMap</text>
<text x="682" y="267" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">通用键值映射；非线程安全</text>
<rect x="660" y="310" width="452" height="62" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="682" y="335" font-size="13px" fill="#16a34a" font-weight="700" text-anchor="start" font-family="monospace">LinkedHashMap</text>
<text x="682" y="357" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">需要插入/访问顺序</text>
<rect x="660" y="400" width="452" height="62" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="682" y="425" font-size="13px" fill="#16a34a" font-weight="700" text-anchor="start" font-family="monospace">TreeMap</text>
<text x="682" y="447" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">需要按 key 排序和范围查询</text>
<rect x="660" y="490" width="452" height="62" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="682" y="515" font-size="13px" fill="#16a34a" font-weight="700" text-anchor="start" font-family="monospace">ConcurrentHashMap</text>
<text x="682" y="537" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">并发读写；不允许 null</text>
<rect x="660" y="580" width="452" height="62" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="682" y="605" font-size="13px" fill="#16a34a" font-weight="700" text-anchor="start" font-family="monospace">Hashtable</text>
<text x="682" y="627" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">遗留类型；通常不作为新代码首选</text>
<rect x="64" y="730" width="1072" height="54" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="88" y="763" font-size="13px" fill="#ea580c" font-weight="700" text-anchor="start">一句话决策：只要 key-value、无顺序、单线程或外部加锁，优先 HashMap；需求一变，先改语义判断，再谈性能调参。</text>
</svg>