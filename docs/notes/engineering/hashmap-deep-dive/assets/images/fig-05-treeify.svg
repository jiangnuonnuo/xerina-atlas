<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Microsoft JhengHei","SimHei",sans-serif}</style>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/></marker>
</defs>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="600.0" y="48" font-size="27px" fill="#111827" font-weight="700" text-anchor="middle">treeify：为什么不是一撞到 8 就立刻变红黑树？</text>
<text x="600.0" y="80" font-size="14px" fill="#6b7280" font-weight="400" text-anchor="middle">JDK 1.8 同时观察冲突深度和数组容量，优先用扩容降低冲突，再决定是否承担 TreeNode 的开销</text>
<line x1="56" y1="104" x2="1144" y2="104" stroke="#d1d5db" stroke-width="2"/>
<rect x="64" y="150" width="320" height="470" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" data-graph-role="container"/>
<rect x="440" y="150" width="320" height="470" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" data-graph-role="container"/>
<rect x="816" y="150" width="320" height="470" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" data-graph-role="container"/>
<text x="88" y="186" font-size="16px" fill="#16a34a" font-weight="700" text-anchor="start">阶段 1 · 冲突累积</text>
<text x="464" y="186" font-size="16px" fill="#ea580c" font-weight="700" text-anchor="start">阶段 2 · 两个条件</text>
<text x="840" y="186" font-size="16px" fill="#dc2626" font-weight="700" text-anchor="start">阶段 3 · 选择结果</text>
<rect x="112" y="220" width="168" height="30" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="196" y="241" font-size="12px" fill="#111827" font-weight="600" text-anchor="middle" font-family="monospace">k1 → next</text>
<line x1="196" y1="250" x2="196" y2="262" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<rect x="112" y="262" width="168" height="30" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="196" y="283" font-size="12px" fill="#111827" font-weight="600" text-anchor="middle" font-family="monospace">k2 → next</text>
<line x1="196" y1="292" x2="196" y2="304" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<rect x="112" y="304" width="168" height="30" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="196" y="325" font-size="12px" fill="#111827" font-weight="600" text-anchor="middle" font-family="monospace">k3 → next</text>
<line x1="196" y1="334" x2="196" y2="346" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<rect x="112" y="346" width="168" height="30" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="196" y="367" font-size="12px" fill="#111827" font-weight="600" text-anchor="middle" font-family="monospace">k4 → next</text>
<line x1="196" y1="376" x2="196" y2="388" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<rect x="112" y="388" width="168" height="30" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="196" y="409" font-size="12px" fill="#111827" font-weight="600" text-anchor="middle" font-family="monospace">k5 → next</text>
<line x1="196" y1="418" x2="196" y2="430" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<rect x="112" y="430" width="168" height="30" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="196" y="451" font-size="12px" fill="#111827" font-weight="600" text-anchor="middle" font-family="monospace">k6 → next</text>
<line x1="196" y1="460" x2="196" y2="472" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<rect x="112" y="472" width="168" height="30" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="196" y="493" font-size="12px" fill="#111827" font-weight="600" text-anchor="middle" font-family="monospace">k7 → next</text>
<line x1="196" y1="502" x2="196" y2="514" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<rect x="112" y="514" width="168" height="30" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="196" y="535" font-size="12px" fill="#111827" font-weight="600" text-anchor="middle" font-family="monospace">k8 → next</text>
<text x="224" y="580" font-size="12px" fill="#6b7280" font-weight="600" text-anchor="middle">binCount 达到阈值</text>
<path d="M 384,384 L 420,384 L 440,384" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="600" y="246" font-size="15px" fill="#ea580c" font-weight="700" text-anchor="middle">链表长度 ≥ 8？</text>
<text x="600" y="278" font-size="13px" fill="#6b7280" font-weight="600" text-anchor="middle">否 → 继续链表</text>
<text x="600" y="354" font-size="15px" fill="#ea580c" font-weight="700" text-anchor="middle">数组容量 ≥ 64？</text>
<text x="600" y="386" font-size="13px" fill="#6b7280" font-weight="600" text-anchor="middle">否 → resize()，先把桶拆散</text>
<text x="600" y="470" font-size="15px" fill="#dc2626" font-weight="700" text-anchor="middle">是 → treeifyBin()</text>
<text x="600" y="502" font-size="13px" fill="#6b7280" font-weight="600" text-anchor="middle">TreeNode + 红黑树</text>
<path d="M 600,292 L 600,336" fill="none" stroke="#ea580c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 600,402 L 600,452" fill="none" stroke="#ea580c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 760,354 L 792,354 L 816,246" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="840" y="246" font-size="17px" fill="#dc2626" font-weight="700" text-anchor="start">红黑树桶</text>
<text x="840" y="282" font-size="16px" fill="#111827" font-weight="700" text-anchor="middle">R</text>
<text x="840" y="322" font-size="14px" fill="#111827" font-weight="700" text-anchor="middle">B</text>
<text x="920" y="322" font-size="14px" fill="#111827" font-weight="700" text-anchor="middle">B</text>
<line x1="840" y1="292" x2="840" y2="308" stroke="#dc2626" stroke-width="1.6"/>
<line x1="840" y1="308" x2="920" y2="308" stroke="#dc2626" stroke-width="1.6"/>
<text x="840" y="392" font-size="13px" fill="#dc2626" font-weight="700" text-anchor="start">树化后：查找 O(log k)</text>
<text x="840" y="428" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">但 TreeNode 更重，且不提供顺序保证</text>
<text x="840" y="480" font-size="13px" fill="#16a34a" font-weight="700" text-anchor="start">扩容/删除后节点 ≤ 6</text>
<text x="840" y="510" font-size="13px" fill="#6b7280" font-weight="400" text-anchor="start">可能退化回链表</text>
<rect x="64" y="670" width="1072" height="72" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.2"/>
<text x="88" y="701" font-size="13px" fill="#111827" font-weight="700" text-anchor="start">高频陷阱</text>
<text x="188" y="701" font-size="13px" fill="#6b7280" font-weight="400" text-anchor="start">TREEIFY_THRESHOLD=8 不是单独条件；MIN_TREEIFY_CAPACITY=64 不满足时会先扩容。</text>
<text x="88" y="725" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">6 是退化阈值，8 是树化阈值，二者不是同一个概念。</text>
</svg>