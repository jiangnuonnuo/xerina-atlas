<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Microsoft JhengHei","SimHei",sans-serif}</style>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/></marker>
</defs>
<rect width="1200" height="900" fill="#ffffff"/>
<text x="600.0" y="48" font-size="27px" fill="#111827" font-weight="700" text-anchor="middle">resize：容量翻倍，但节点不必重新计算完整 hash</text>
<text x="600.0" y="80" font-size="14px" fill="#6b7280" font-weight="400" text-anchor="middle">旧容量 4 扩到 8 时，只检查新增的那一位：元素要么留在 lo，要么移动到 hi</text>
<line x1="56" y1="104" x2="1144" y2="104" stroke="#d1d5db" stroke-width="2"/>
<rect x="64" y="136" width="404" height="544" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" data-graph-role="container"/>
<rect x="732" y="136" width="404" height="544" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" data-graph-role="container"/>
<text x="88" y="172" font-size="17px" fill="#2563eb" font-weight="700" text-anchor="start">旧数组 · capacity = 4</text>
<text x="756" y="172" font-size="17px" fill="#16a34a" font-weight="700" text-anchor="start">新数组 · capacity = 8</text>
<rect x="88" y="206" width="356" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
<text x="110" y="236" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">桶 0</text>
<text x="204" y="236" font-size="14px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">null</text>
<rect x="88" y="310" width="356" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
<text x="110" y="340" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">桶 1</text>
<text x="204" y="340" font-size="14px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">null</text>
<rect x="88" y="414" width="356" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
<text x="110" y="444" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">桶 2</text>
<text x="204" y="444" font-size="14px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">null</text>
<rect x="88" y="518" width="356" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
<text x="110" y="548" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">桶 3</text>
<text x="204" y="548" font-size="14px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">3 → 7 → 15</text>
<rect x="756" y="196" width="356" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="776" y="223" font-size="12px" fill="#16a34a" font-weight="700" text-anchor="start">桶 0</text>
<text x="870" y="223" font-size="13px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">null</text>
<rect x="756" y="254" width="356" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="776" y="281" font-size="12px" fill="#16a34a" font-weight="700" text-anchor="start">桶 1</text>
<text x="870" y="281" font-size="13px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">null</text>
<rect x="756" y="312" width="356" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="776" y="339" font-size="12px" fill="#16a34a" font-weight="700" text-anchor="start">桶 2</text>
<text x="870" y="339" font-size="13px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">null</text>
<rect x="756" y="370" width="356" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="776" y="397" font-size="12px" fill="#16a34a" font-weight="700" text-anchor="start">桶 3</text>
<text x="870" y="397" font-size="13px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">3</text>
<rect x="756" y="428" width="356" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="776" y="455" font-size="12px" fill="#16a34a" font-weight="700" text-anchor="start">桶 4</text>
<text x="870" y="455" font-size="13px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">null</text>
<rect x="756" y="486" width="356" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="776" y="513" font-size="12px" fill="#16a34a" font-weight="700" text-anchor="start">桶 5</text>
<text x="870" y="513" font-size="13px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">null</text>
<rect x="756" y="544" width="356" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="776" y="571" font-size="12px" fill="#16a34a" font-weight="700" text-anchor="start">桶 6</text>
<text x="870" y="571" font-size="13px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">null</text>
<rect x="756" y="602" width="356" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="776" y="629" font-size="12px" fill="#16a34a" font-weight="700" text-anchor="start">桶 7</text>
<text x="870" y="629" font-size="13px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">7 → 15</text>
<rect x="500" y="244" width="200" height="124" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="600" y="274" font-size="15px" fill="#ea580c" font-weight="700" text-anchor="middle">看新增位</text>
<text x="600" y="304" font-size="13px" fill="#111827" font-weight="600" text-anchor="middle" font-family="monospace">(e.hash &amp; oldCap)</text>
<text x="600" y="334" font-size="12px" fill="#6b7280" font-weight="600" text-anchor="middle">0 → lo；非 0 → hi</text>
<path d="M 444,508 L 488,508 L 488,306 L 500,306" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 700,306 L 720,306 L 720,362 L 756,362" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M 700,334 L 720,334 L 720,594 L 756,594" fill="none" stroke="#16a34a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="492" y="492" font-size="11px" fill="#2563eb" font-weight="600" text-anchor="middle">链表按顺序拆成两段</text>
<rect x="64" y="722" width="1072" height="92" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.2"/>
<text x="88" y="752" font-size="14px" fill="#111827" font-weight="700" text-anchor="start">为什么容量必须是 2 的幂？</text>
<text x="88" y="780" font-size="13px" fill="#6b7280" font-weight="400" text-anchor="start">n-1 的低位全是 1，(n-1)&amp;hash 等价于 hash%n；扩容时只新增一位，因此下标只可能是 i 或 i+oldCap。</text>
<text x="88" y="804" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">JDK 1.8 通过低位链表 lo 和高位链表 hi 保留相对顺序，避免 1.7 迁移时的头插反转。</text>
<text x="64" y="846" font-size="12px" fill="#6b7280" font-weight="700" text-anchor="start">图例</text>
<line x1="72" y1="866" x2="110" y2="866" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="120" y="871" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">旧桶</text>
<line x1="72" y1="866" x2="110" y2="866" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><text x="120" y="871" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">迁移结果</text>
</svg>