<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Microsoft JhengHei","SimHei",sans-serif}</style>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/></marker>
</defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="600.0" y="48" font-size="27px" fill="#111827" font-weight="700" text-anchor="middle">HashMap 的一条主线：key 如何变成 value</text>
<text x="600.0" y="80" font-size="14px" fill="#6b7280" font-weight="400" text-anchor="middle">先定位桶，再在桶内按结构查找；扩容只在写入路径上发生</text>
<line x1="56" y1="104" x2="1144" y2="104" stroke="#d1d5db" stroke-width="2"/>
<rect x="64" y="140" width="216" height="96" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="170" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">输入</text>
<text x="84" y="199" font-size="16px" fill="#111827" font-weight="700" text-anchor="start" font-family="monospace">key / value</text>
<text x="84" y="222" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">业务对象进入 Map</text>
<rect x="320" y="140" width="216" height="96" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
<text x="340" y="170" font-size="13px" fill="#9333ea" font-weight="700" text-anchor="start">扰动</text>
<text x="340" y="199" font-size="16px" fill="#111827" font-weight="700" text-anchor="start" font-family="monospace">h = hash(key)</text>
<text x="340" y="222" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">高 16 位混入低位</text>
<rect x="576" y="140" width="216" height="96" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="596" y="170" font-size="13px" fill="#16a34a" font-weight="700" text-anchor="start">定位</text>
<text x="596" y="199" font-size="16px" fill="#111827" font-weight="700" text-anchor="start" font-family="monospace">i = (n - 1) &amp; h</text>
<text x="596" y="222" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">得到桶下标</text>
<rect x="832" y="140" width="216" height="96" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="852" y="170" font-size="13px" fill="#ea580c" font-weight="700" text-anchor="start">桶数组</text>
<text x="852" y="199" font-size="16px" fill="#111827" font-weight="700" text-anchor="start" font-family="monospace">table[i]</text>
<text x="852" y="222" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">拿到首节点</text>
<line x1="280" y1="188" x2="312" y2="188" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="296" y="174" font-size="11px" fill="#2563eb" font-weight="600" text-anchor="middle">hash 扰动</text>
<line x1="536" y1="188" x2="568" y2="188" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="552" y="174" font-size="11px" fill="#2563eb" font-weight="600" text-anchor="middle">位与定位</text>
<line x1="792" y1="188" x2="824" y2="188" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="808" y="174" font-size="11px" fill="#2563eb" font-weight="600" text-anchor="middle">访问桶</text>
<text x="600" y="266" font-size="17px" fill="#111827" font-weight="700" text-anchor="middle">桶内结构决定查找方式</text>
<rect x="64" y="320" width="336" height="238" rx="14" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.8"/>
<text x="88" y="354" font-size="17px" fill="#d1d5db" font-weight="700" text-anchor="start">空桶</text>
<text x="88" y="385" font-size="14px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">table[i] == null</text>
<line x1="88" y1="403" x2="376" y2="403" stroke="#d1d5db" stroke-width="1"/>
<text x="88" y="444" font-size="13px" fill="#111827" font-weight="400" text-anchor="start">第一次写入直接 new Node</text>
<text x="88" y="478" font-size="13px" fill="#6b7280" font-weight="400" text-anchor="start">平均插入 O(1)</text>
<text x="88" y="526" font-size="11px" fill="#6b7280" font-weight="400" text-anchor="start">结构不是三选一的配置项，而是桶内状态</text>
<rect x="432" y="320" width="336" height="238" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="456" y="354" font-size="17px" fill="#16a34a" font-weight="700" text-anchor="start">链表桶</text>
<text x="456" y="385" font-size="14px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">Node.next</text>
<line x1="456" y1="403" x2="744" y2="403" stroke="#16a34a" stroke-width="1"/>
<text x="456" y="444" font-size="13px" fill="#111827" font-weight="400" text-anchor="start">逐个比较 hash + equals</text>
<text x="456" y="478" font-size="13px" fill="#6b7280" font-weight="400" text-anchor="start">冲突少时成本很低</text>
<text x="456" y="526" font-size="11px" fill="#6b7280" font-weight="400" text-anchor="start">结构不是三选一的配置项，而是桶内状态</text>
<rect x="800" y="320" width="336" height="238" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="824" y="354" font-size="17px" fill="#dc2626" font-weight="700" text-anchor="start">树桶</text>
<text x="824" y="385" font-size="14px" fill="#111827" font-weight="600" text-anchor="start" font-family="monospace">TreeNode</text>
<line x1="824" y1="403" x2="1112" y2="403" stroke="#dc2626" stroke-width="1"/>
<text x="824" y="444" font-size="13px" fill="#111827" font-weight="400" text-anchor="start">红黑树查找 O(log k)</text>
<text x="824" y="478" font-size="13px" fill="#6b7280" font-weight="400" text-anchor="start">冲突过深时作为兜底</text>
<text x="824" y="526" font-size="11px" fill="#6b7280" font-weight="400" text-anchor="start">结构不是三选一的配置项，而是桶内状态</text>
<path d="M 940,236 L 940,278 L 232,278 L 232,320" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 940,236 L 940,278 L 600,278 L 600,320" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 940,236 L 940,278 L 968,278 L 968,320" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<rect x="64" y="606" width="1024" height="62" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.2"/>
<text x="88" y="632" font-size="13px" fill="#111827" font-weight="700" text-anchor="start">复杂度记忆</text>
<text x="208" y="632" font-size="13px" fill="#16a34a" font-weight="700" text-anchor="start">平均 get/put/remove ≈ O(1)</text>
<text x="470" y="632" font-size="13px" fill="#dc2626" font-weight="700" text-anchor="start">树桶查找 ≈ O(log k)</text>
<text x="690" y="632" font-size="13px" fill="#2563eb" font-weight="700" text-anchor="start">遍历 ≈ O(capacity + size)</text>
<text x="88" y="654" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">实际表现取决于哈希分布、容量、装载因子与是否触发 resize。</text>
<text x="64" y="682" font-size="12px" fill="#6b7280" font-weight="700" text-anchor="start">图例</text>
<line x1="72" y1="702" x2="110" y2="702" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="120" y="707" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">主流程</text>
<line x1="72" y1="702" x2="110" y2="702" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/><text x="120" y="707" font-size="12px" fill="#6b7280" font-weight="400" text-anchor="start">结构分流</text>
</svg>