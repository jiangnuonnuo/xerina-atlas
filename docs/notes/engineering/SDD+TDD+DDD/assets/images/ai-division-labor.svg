<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <rect width="1000" height="640" fill="#ffffff"/>
  <defs></defs>
  <text x="500" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">AI 时代的分工表：谁该干什么，别抢也别甩</text>
  <text x="500" y="68" text-anchor="middle" font-size="13" fill="#6b7280">这张表的核心结论：人往上走，AI 往中间走</text>
  <rect x="40" y="96" width="920" height="50" rx="8" fill="#111827"/>
  <text x="58" y="128" text-anchor="start" font-size="14" font-weight="600" fill="#ffffff">环节</text>
  <text x="275" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">人主导</text>
  <text x="485" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">AI 主导</text>
  <text x="775" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">具体在做什么</text>
  <rect x="40" y="146" width="920" height="46" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="175" font-size="13.5" font-weight="600" fill="#111827">需求澄清</text>
  <rect x="170" y="154" width="210" height="30" fill="#dcfce7"/>
  <text x="275" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">人</text>
  <rect x="380" y="154" width="210" height="30" fill="#f9fafb"/>
  <text x="485" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">辅助</text>
  <text x="608" y="175" font-size="12.5" fill="#374151">业务口径、指标定义、谁负责拍板，必须由人确认</text>
  <rect x="40" y="192" width="920" height="46" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="221" font-size="13.5" font-weight="600" fill="#111827">领域建模</text>
  <rect x="170" y="200" width="210" height="30" fill="#dcfce7"/>
  <text x="275" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">人</text>
  <rect x="380" y="200" width="210" height="30" fill="#f9fafb"/>
  <text x="485" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">辅助</text>
  <text x="608" y="221" font-size="12.5" fill="#374151">限界上下文怎么切、聚合根是谁、核心域投多少资源</text>
  <rect x="40" y="238" width="920" height="46" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="267" font-size="13.5" font-weight="600" fill="#111827">写规格 Spec</text>
  <rect x="170" y="246" width="210" height="30" fill="#dcfce7"/>
  <text x="275" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">人</text>
  <rect x="380" y="246" width="210" height="30" fill="#dbeafe"/>
  <text x="485" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">起草</text>
  <text x="608" y="267" font-size="12.5" fill="#374151">AI 出第一版结构化 spec，人删冗余、锁不变量、划红线</text>
  <rect x="40" y="284" width="920" height="46" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="313" font-size="13.5" font-weight="600" fill="#111827">写测试</text>
  <rect x="170" y="292" width="210" height="30" fill="#dcfce7"/>
  <text x="275" y="314" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">人把关</text>
  <rect x="380" y="292" width="210" height="30" fill="#dbeafe"/>
  <text x="485" y="314" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">起草</text>
  <text x="608" y="313" font-size="12.5" fill="#374151">AI 生成用例初稿，人补齐边界、异常、组合场景并审断言</text>
  <rect x="40" y="330" width="920" height="46" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="359" font-size="13.5" font-weight="600" fill="#111827">写实现</text>
  <rect x="170" y="338" width="210" height="30" fill="#f9fafb"/>
  <text x="275" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">审</text>
  <rect x="380" y="338" width="210" height="30" fill="#dbeafe"/>
  <text x="485" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">AI</text>
  <text x="608" y="359" font-size="12.5" fill="#374151">在 spec 边界内生成代码，不许改 spec，不许越过禁止行为</text>
  <rect x="40" y="376" width="920" height="46" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="405" font-size="13.5" font-weight="600" fill="#111827">重构</text>
  <rect x="170" y="384" width="210" height="30" fill="#dcfce7"/>
  <text x="275" y="406" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">人定方向</text>
  <rect x="380" y="384" width="210" height="30" fill="#dbeafe"/>
  <text x="485" y="406" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">AI</text>
  <text x="608" y="405" font-size="12.5" fill="#374151">AI 做提取与规整，人决定结构、分层和该不该引入抽象</text>
  <rect x="40" y="422" width="920" height="46" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="451" font-size="13.5" font-weight="600" fill="#111827">验收</text>
  <rect x="170" y="430" width="210" height="30" fill="#dcfce7"/>
  <text x="275" y="452" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">人</text>
  <rect x="380" y="430" width="210" height="30" fill="#f9fafb"/>
  <text x="485" y="452" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">核验</text>
  <text x="608" y="451" font-size="12.5" fill="#374151">对照 spec 与测试报告验收，而不是逐行读 AI 写的代码</text>
  <rect x="40" y="468" width="920" height="46" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="497" font-size="13.5" font-weight="600" fill="#111827">归档</text>
  <rect x="170" y="476" width="210" height="30" fill="#dcfce7"/>
  <text x="275" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">人</text>
  <rect x="380" y="476" width="210" height="30" fill="#dbeafe"/>
  <text x="485" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">AI</text>
  <text x="608" y="497" font-size="12.5" fill="#374151">把增量 spec 合回主 spec，让下一次变更有据可查</text>
  <rect x="40" y="532" width="920" height="76" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="62" y="558" font-size="13.5" font-weight="600" fill="#c2410c">最常见的翻车姿势</text>
  <text x="62" y="582" font-size="12.5" fill="#374151">AI 写 spec、AI 写测试、AI 写代码，人只负责点运行 —— 短期很爽，长期一定会出事</text>
  <text x="62" y="600" font-size="12.5" fill="#6b7280">人是质量的最终责任人。规则制定和验收，这两头不能交出去。</text>
</svg>