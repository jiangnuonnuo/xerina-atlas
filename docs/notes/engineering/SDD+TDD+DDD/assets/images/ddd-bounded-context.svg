<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">DDD 在干什么：先划地盘，再谈装修</text>
  <text x="500" y="68" text-anchor="middle" font-size="13" fill="#6b7280">同一个「订单」，在点单、厨房、库存、结账四个地盘里含义完全不同</text>
  <text x="180" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">拆分前：一个大泥球</text>
  <rect x="30" y="118" width="300" height="300" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="180" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">OrderServiceImpl.java</text>
  <text x="180" y="172" text-anchor="middle" font-size="12" fill="#b91c1c">3200 行 · 谁也不敢改</text>
  <path d="M 70 200 C 130 230, 200 180, 260 215 S 160 260, 90 250" fill="none" stroke="#fca5a5" stroke-width="1.6"/>
  <path d="M 60 240 C 140 275, 230 230, 280 270 S 190 300, 110 295" fill="none" stroke="#fca5a5" stroke-width="1.6"/>
  <path d="M 75 285 C 150 320, 250 275, 295 315 S 200 345, 120 340" fill="none" stroke="#fca5a5" stroke-width="1.6"/>
  <path d="M 65 330 C 145 365, 245 320, 285 360 S 195 385, 105 380" fill="none" stroke="#fca5a5" stroke-width="1.6"/>
  <text x="180" y="405" text-anchor="middle" font-size="12.5" fill="#b91c1c">改一个字段，四个业务同时炸</text>
  <line x1="345" y1="268" x2="405" y2="268" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="375" y="252" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">限界上下文</text>
  <text x="375" y="292" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">切分</text>
  <rect x="420" y="110" width="265" height="128" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="420" y="110" width="4" height="128" rx="2" fill="#1d4ed8"/>
  <text x="438" y="140" font-size="15" font-weight="600" fill="#1d4ed8">点单上下文</text>
  <text x="438" y="170" font-size="12.5" fill="#374151">统一语言：购物车、下单、改单</text>
  <text x="438" y="196" font-size="12.5" fill="#6b7280">负责：用户选了什么</text>
  <line x1="438" y1="214" x2="667" y2="214" stroke="#bfdbfe" stroke-width="1" opacity="0.6"/>
  <rect x="715" y="110" width="265" height="128" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="715" y="110" width="4" height="128" rx="2" fill="#c2410c"/>
  <text x="733" y="140" font-size="15" font-weight="600" fill="#c2410c">厨房上下文</text>
  <text x="733" y="170" font-size="12.5" fill="#374151">统一语言：出餐、排队、退菜</text>
  <text x="733" y="196" font-size="12.5" fill="#6b7280">负责：怎么把东西做出来</text>
  <line x1="733" y1="214" x2="962" y2="214" stroke="#fed7aa" stroke-width="1" opacity="0.6"/>
  <rect x="420" y="265" width="265" height="128" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="420" y="265" width="4" height="128" rx="2" fill="#15803d"/>
  <text x="438" y="295" font-size="15" font-weight="600" fill="#15803d">库存上下文</text>
  <text x="438" y="325" font-size="12.5" fill="#374151">统一语言：占用、释放、锁定</text>
  <text x="438" y="351" font-size="12.5" fill="#6b7280">负责：还有没有货</text>
  <line x1="438" y1="369" x2="667" y2="369" stroke="#bbf7d0" stroke-width="1" opacity="0.6"/>
  <rect x="715" y="265" width="265" height="128" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <rect x="715" y="265" width="4" height="128" rx="2" fill="#7c3aed"/>
  <text x="733" y="295" font-size="15" font-weight="600" fill="#7c3aed">结账上下文</text>
  <text x="733" y="325" font-size="12.5" fill="#374151">统一语言：支付、退款、对账</text>
  <text x="733" y="351" font-size="12.5" fill="#6b7280">负责：钱怎么算清</text>
  <line x1="733" y1="369" x2="962" y2="369" stroke="#e9d5ff" stroke-width="1" opacity="0.6"/>
  <text x="702" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">拆分后：四个能各自演进的地盘</text>
  <line x1="30" y1="440" x2="970" y2="440" stroke="#e5e7eb" stroke-width="1"/>
  <text x="30" y="468" font-size="14" font-weight="600" fill="#111827">划地盘的三条硬规矩</text>
  <rect x="30" y="490" width="310" height="86" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="48" y="516" font-size="13.5" font-weight="600" fill="#111827">1. 上下文内术语唯一</text>
  <text x="48" y="542" font-size="12" fill="#6b7280">同一个词在同一个地盘里只有一个含义，</text>
  <text x="48" y="562" font-size="12" fill="#6b7280">不允许「订单」既是购物车又是发票。</text>
  <rect x="350" y="490" width="310" height="86" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="368" y="516" font-size="13.5" font-weight="600" fill="#111827">2. 跨上下文只走契约</text>
  <text x="368" y="542" font-size="12" fill="#6b7280">别的地盘的内部对象不许直接引用，</text>
  <text x="368" y="562" font-size="12" fill="#6b7280">只能走接口、事件或防腐层。</text>
  <rect x="670" y="490" width="310" height="86" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="688" y="516" font-size="13.5" font-weight="600" fill="#111827">3. 好钢用在核心域</text>
  <text x="688" y="542" font-size="12" fill="#6b7280">区分核心域、支撑域、通用域。</text>
  <text x="688" y="562" font-size="12" fill="#6b7280">核心域投入最多设计，通用域能买就买。</text>
</svg>