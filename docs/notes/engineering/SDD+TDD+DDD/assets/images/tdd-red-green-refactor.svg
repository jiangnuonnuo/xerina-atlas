<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">TDD 的节拍：红 → 绿 → 重构</text>
  <text x="480" y="68" text-anchor="middle" font-size="13" fill="#6b7280">先写一定会失败的测试，再写刚好让它通过的代码，最后才谈优雅</text>
  <rect x="70" y="100" width="260" height="300" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/>
  <circle cx="94" cy="128" r="7" fill="#dc2626"/>
  <text x="110" y="133" font-size="12" font-weight="600" fill="#dc2626" letter-spacing="1">RED</text>
  <text x="200" y="166" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">红：先立规矩</text>
  <line x1="90" y1="182" x2="310" y2="182" stroke="#fecaca" stroke-width="1" opacity="0.7"/>
  <text x="90" y="210" font-size="12.5" fill="#374151">写一个现在一定会失败的测试</text>
  <text x="90" y="236" font-size="12.5" fill="#374151">assert 扣 200 分后余额 = 300</text>
  <text x="90" y="262" font-size="12.5" fill="#374151">此时 PointsService 还不存在</text>
  <text x="90" y="288" font-size="12.5" fill="#374151">→ 编译都过不了，测试全红</text>
  <rect x="88" y="340" width="224" height="30" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="200" y="359" text-anchor="middle" font-size="11.5" fill="#6b7280">这一步在定义「什么叫做对」</text>
  <rect x="350" y="100" width="260" height="300" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
  <circle cx="374" cy="128" r="7" fill="#16a34a"/>
  <text x="390" y="133" font-size="12" font-weight="600" fill="#16a34a" letter-spacing="1">GREEN</text>
  <text x="480" y="166" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">绿：最小实现</text>
  <line x1="370" y1="182" x2="590" y2="182" stroke="#bbf7d0" stroke-width="1" opacity="0.7"/>
  <text x="370" y="210" font-size="12.5" fill="#374151">写最少的代码让测试变绿</text>
  <text x="370" y="236" font-size="12.5" fill="#374151">不优雅没关系，重复也没关系</text>
  <text x="370" y="262" font-size="12.5" fill="#374151">只要余额算对、流水记上就行</text>
  <text x="370" y="288" font-size="12.5" fill="#374151">→ 全绿，提交</text>
  <rect x="368" y="340" width="224" height="30" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="480" y="359" text-anchor="middle" font-size="11.5" fill="#6b7280">禁止提前优化，禁止顺手加功能</text>
  <rect x="630" y="100" width="260" height="300" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.6"/>
  <circle cx="654" cy="128" r="7" fill="#9333ea"/>
  <text x="670" y="133" font-size="12" font-weight="600" fill="#9333ea" letter-spacing="1">REFACTOR</text>
  <text x="760" y="166" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">重构：改结构不改行为</text>
  <line x1="650" y1="182" x2="870" y2="182" stroke="#e9d5ff" stroke-width="1" opacity="0.7"/>
  <text x="650" y="210" font-size="12.5" fill="#374151">提常量、抽方法、消重复</text>
  <text x="650" y="236" font-size="12.5" fill="#374151">把魔法数字换成 MAX_POINTS</text>
  <text x="650" y="262" font-size="12.5" fill="#374151">每改一步就跑一次测试</text>
  <text x="650" y="288" font-size="12.5" fill="#374151">→ 结构变好，行为不变</text>
  <rect x="648" y="340" width="224" height="30" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="760" y="359" text-anchor="middle" font-size="11.5" fill="#6b7280">没有测试垫底的重构叫「赌博」</text>
  <path d="M 330 250 L 350 250" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M 610 250 L 630 250" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M 760 400 L 760 450 L 200 450 L 200 400" stroke="#9333ea" stroke-width="2" fill="none" stroke-dasharray="7,4" marker-end="url(#ap)"/>
  <text x="480" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7c3aed">下一个行为契约，继续转</text>
  <rect x="40" y="490" width="880" height="94" rx="10" fill="#111827"/>
  <text x="480" y="519" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">AI 时代为什么 TDD 反而更好用了</text>
  <text x="480" y="545" text-anchor="middle" font-size="12.5" fill="#d1d5db">写测试曾经是最贵的一步，AI 可以几秒生成初稿；但「这条测试到底断言了什么」必须由人把关</text>
  <text x="480" y="569" text-anchor="middle" font-size="12.5" fill="#d1d5db">校验方法：故意把实现改错，测试还全绿 —— 那这批测试就是废的</text>
</svg>