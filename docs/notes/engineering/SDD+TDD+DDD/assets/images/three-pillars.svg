<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">SDD + TDD + DDD：同一件事的三个切面</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#6b7280">它们不竞争，只是分别回答了三个不同层级的问题</text>
  <rect x="45" y="96" width="250" height="34" rx="17" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="170" y="118" text-anchor="middle" font-size="14" fill="#374151">业务到底是什么？</text>
  <rect x="375" y="96" width="250" height="34" rx="17" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="500" y="118" text-anchor="middle" font-size="14" fill="#374151">要做到什么算合格？</text>
  <rect x="705" y="96" width="250" height="34" rx="17" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="830" y="118" text-anchor="middle" font-size="14" fill="#374151">凭什么说做对了？</text>
  <rect x="20" y="150" width="300" height="300" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <path d="M 20 160 h 300 v -0 a10,10 0 0 1 -10,-10 h -280 a10,10 0 0 1 -10,10 z" fill="#eff6ff"/>
  <rect x="20" y="150" width="300" height="52" rx="10" fill="#eff6ff"/>
  <rect x="20" y="192" width="300" height="10" fill="#eff6ff"/>
  <text x="170" y="175" text-anchor="middle" font-size="17" font-weight="600" fill="#1d4ed8">DDD · 领域驱动设计</text>
  <text x="170" y="190" text-anchor="middle" font-size="12.5" fill="#6b7280">一句话：划地盘</text>
  <text x="40" y="228" font-size="13" font-weight="600" fill="#111827">回答的问题：</text>
  <text x="118" y="228" font-size="13" fill="#374151">业务边界在哪，</text>
  <text x="118" y="260" font-size="13" fill="#374151">术语怎么统一</text>
  <text x="40" y="286" font-size="13" font-weight="600" fill="#111827">核心产物：</text>
  <text x="105" y="286" font-size="13" fill="#374151">领域模型、限界上下文、</text>
  <text x="118" y="312" font-size="13" fill="#374151">统一语言、聚合根</text>
  <text x="40" y="338" font-size="13" font-weight="600" fill="#111827">管的混乱：</text>
  <text x="105" y="338" font-size="13" fill="#374151">业务世界的混乱</text>
  <text x="40" y="370" font-size="13" font-weight="600" fill="#111827">不负责：</text>
  <text x="92" y="370" font-size="13" fill="#374151">不规定接口长什么样</text>
  <rect x="350" y="150" width="300" height="300" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
  <path d="M 350 160 h 300 v -0 a10,10 0 0 1 -10,-10 h -280 a10,10 0 0 1 -10,10 z" fill="#faf5ff"/>
  <rect x="350" y="150" width="300" height="52" rx="10" fill="#faf5ff"/>
  <rect x="350" y="192" width="300" height="10" fill="#faf5ff"/>
  <text x="500" y="175" text-anchor="middle" font-size="17" font-weight="600" fill="#7c3aed">SDD · 规格驱动开发</text>
  <text x="500" y="190" text-anchor="middle" font-size="12.5" fill="#6b7280">一句话：签合同</text>
  <text x="370" y="228" font-size="13" font-weight="600" fill="#111827">回答的问题：</text>
  <text x="448" y="228" font-size="13" fill="#374151">输入是什么、输出是什么、</text>
  <text x="448" y="260" font-size="13" fill="#374151">哪些情况必须失败</text>
  <text x="370" y="286" font-size="13" font-weight="600" fill="#111827">核心产物：</text>
  <text x="435" y="286" font-size="13" fill="#374151">Spec 规格、状态机、</text>
  <text x="448" y="312" font-size="13" fill="#374151">约束与不变量、验收标准</text>
  <text x="370" y="338" font-size="13" font-weight="600" fill="#111827">管的混乱：</text>
  <text x="435" y="338" font-size="13" fill="#374151">人机协作的混乱</text>
  <text x="370" y="370" font-size="13" font-weight="600" fill="#111827">不负责：</text>
  <text x="422" y="370" font-size="13" fill="#374151">不替你做业务判断</text>
  <rect x="680" y="150" width="300" height="300" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <path d="M 680 160 h 300 v -0 a10,10 0 0 1 -10,-10 h -280 a10,10 0 0 1 -10,10 z" fill="#f0fdf4"/>
  <rect x="680" y="150" width="300" height="52" rx="10" fill="#f0fdf4"/>
  <rect x="680" y="192" width="300" height="10" fill="#f0fdf4"/>
  <text x="830" y="175" text-anchor="middle" font-size="17" font-weight="600" fill="#15803d">TDD · 测试驱动开发</text>
  <text x="830" y="190" text-anchor="middle" font-size="12.5" fill="#6b7280">一句话：立规矩</text>
  <text x="700" y="228" font-size="13" font-weight="600" fill="#111827">回答的问题：</text>
  <text x="778" y="228" font-size="13" fill="#374151">什么叫通过，</text>
  <text x="778" y="260" font-size="13" fill="#374151">回归了谁能发现</text>
  <text x="700" y="286" font-size="13" font-weight="600" fill="#111827">核心产物：</text>
  <text x="765" y="286" font-size="13" fill="#374151">红灯测试、断言、</text>
  <text x="778" y="312" font-size="13" fill="#374151">回归套件、覆盖率</text>
  <text x="700" y="338" font-size="13" font-weight="600" fill="#111827">管的混乱：</text>
  <text x="765" y="338" font-size="13" fill="#374151">实现过程的混乱</text>
  <text x="700" y="370" font-size="13" font-weight="600" fill="#111827">不负责：</text>
  <text x="752" y="370" font-size="13" fill="#374151">不负责写业务代码</text>
  <line x1="170" y1="450" x2="170" y2="486" stroke="#9ca3af" stroke-width="1.5" marker-end="url(##ab)"/>
  <line x1="500" y1="450" x2="500" y2="486" stroke="#9ca3af" stroke-width="1.5" marker-end="url(##ap)"/>
  <line x1="830" y1="450" x2="830" y2="486" stroke="#9ca3af" stroke-width="1.5" marker-end="url(##ag)"/>
  <rect x="20" y="496" width="960" height="66" rx="10" fill="#111827"/>
  <text x="500" y="524" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">AI 编码 Agent：在 DDD 划的边界内，按 SDD 写的合同写，由 TDD 的测试验收</text>
  <text x="500" y="548" text-anchor="middle" font-size="12.5" fill="#d1d5db">人负责定义「做什么、做到什么算合格、怎么验收」，AI 负责「怎么写」</text>
  <line x1="20" y1="592" x2="980" y2="592" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="20" y="606" width="10" height="10" rx="2" fill="#1d4ed8"/>
  <text x="38" y="616" font-size="12.5" fill="#6b7280">DDD 管业务边界</text>
  <rect x="170" y="606" width="10" height="10" rx="2" fill="#7c3aed"/>
  <text x="188" y="616" font-size="12.5" fill="#6b7280">SDD 管人机合同</text>
  <rect x="320" y="606" width="10" height="10" rx="2" fill="#15803d"/>
  <text x="338" y="616" font-size="12.5" fill="#6b7280">TDD 管验证闭环</text>
  <text x="470" y="616" font-size="12.5" fill="#9ca3af">缺任何一条，另外两条都会塌一半</text>
</svg>