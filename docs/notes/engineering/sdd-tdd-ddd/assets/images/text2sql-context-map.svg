<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#15803d"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c2410c"/>
    </marker>
    <marker id="agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1060" height="660" fill="#ffffff"/>
  <text x="530" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">实战第 1 步 · 用 DDD 给 Text2SQL 划四块地</text>
  <text x="530" y="68" text-anchor="middle" font-size="13" fill="#6b7280">不切分的话，它会长成一个「什么都干的 SQLService」</text>
  <rect x="440" y="96" width="180" height="46" rx="23" fill="#111827"/>
  <text x="530" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">业务问题（自然语言）</text>
  <line x1="530" y1="142" x2="530" y2="176" stroke="#6b7280" stroke-width="1.8" marker-end="url(#agr)"/>
  <text x="548" y="164" font-size="11.5" fill="#6b7280">「对比本周和上周各渠道销售额」</text>
  <rect x="40" y="190" width="232" height="248" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="56" y="220" font-size="15" font-weight="600" fill="#1d4ed8">语义治理上下文</text>
  <text x="56" y="242" font-size="12" fill="#6b7280">把业务词翻译成指标和维度</text>
  <line x1="56" y1="256" x2="256" y2="256" stroke="#bfdbfe" stroke-width="1" opacity="0.7"/>
  <text x="56" y="282" font-size="11.5" fill="#374151">核心对象：指标、维度、度量、业务词典</text>
  <text x="56" y="308" font-size="11.5" fill="#374151">不变量：未注册的词不许直接当列名</text>
  <text x="56" y="334" font-size="11.5" fill="#374151">对外契约：getSemanticModel()</text>
  <rect x="294" y="190" width="232" height="248" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="310" y="220" font-size="15" font-weight="600" fill="#0f766e">Schema 探查上下文</text>
  <text x="310" y="242" font-size="12" fill="#6b7280">搞清楚库里到底有哪些表和列</text>
  <line x1="310" y1="256" x2="510" y2="256" stroke="#99f6e4" stroke-width="1" opacity="0.7"/>
  <text x="310" y="282" font-size="11.5" fill="#374151">核心对象：表、列、方言、血缘</text>
  <text x="310" y="308" font-size="11.5" fill="#374151">不变量：物理列的中文别名只作展示</text>
  <text x="310" y="334" font-size="11.5" fill="#374151">对外契约：getSchema(table)</text>
  <rect x="548" y="190" width="232" height="248" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="564" y="220" font-size="15" font-weight="600" fill="#c2410c">受控执行上下文</text>
  <text x="564" y="242" font-size="12" fill="#6b7280">只允许只读、限流、可审计地跑 SQL</text>
  <line x1="564" y1="256" x2="764" y2="256" stroke="#fed7aa" stroke-width="1" opacity="0.7"/>
  <text x="564" y="282" font-size="11.5" fill="#374151">核心对象：只读连接、限流器、审计日志</text>
  <text x="564" y="308" font-size="11.5" fill="#374151">不变量：只放行 SELECT，</text>
  <text x="564" y="334" font-size="11.5" fill="#374151">　　　　禁止 DDL 和 DML</text>
  <text x="564" y="360" font-size="11.5" fill="#374151">对外契约：executeReadOnly(sql)</text>
  <rect x="802" y="190" width="232" height="248" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="818" y="220" font-size="15" font-weight="600" fill="#7c3aed">结果呈现上下文</text>
  <text x="818" y="242" font-size="12" fill="#6b7280">把结果集变成表、图、摘要</text>
  <line x1="818" y1="256" x2="1018" y2="256" stroke="#e9d5ff" stroke-width="1" opacity="0.7"/>
  <text x="818" y="282" font-size="11.5" fill="#374151">核心对象：结果信封、字段引用</text>
  <text x="818" y="308" font-size="11.5" fill="#374151">不变量：结论必须能回溯到 SQL</text>
  <text x="818" y="334" font-size="11.5" fill="#374151">对外契约：render(reportBlocks)</text>
  <rect x="40" y="470" width="994" height="62" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="530" y="496" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">编排层：意图解析 → 语义绑定 → SQL 生成 → 受控执行 → 结果封装</text>
  <text x="530" y="518" text-anchor="middle" font-size="12" fill="#6b7280">编排层自己不发明术语，只负责按上下文的契约串联，每一跳的输入输出都是结构化对象</text>
  <line x1="156" y1="438" x2="156" y2="470" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="410" y1="438" x2="410" y2="470" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="664" y1="438" x2="664" y2="470" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="918" y1="438" x2="918" y2="470" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="530" y1="532" x2="530" y2="560" stroke="#6b7280" stroke-width="1.8" marker-end="url(#agr)"/>
  <rect x="20" y="566" width="200" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="120" y="601" text-anchor="middle" font-size="12.5" fill="#374151">数仓 / 明细事实层</text>
  <rect x="280" y="566" width="200" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="380" y="601" text-anchor="middle" font-size="12.5" fill="#374151">语义模型与指标引擎</text>
  <rect x="540" y="566" width="200" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="640" y="601" text-anchor="middle" font-size="12.5" fill="#374151">只读数据库连接</text>
  <rect x="800" y="566" width="200" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="900" y="601" text-anchor="middle" font-size="12.5" fill="#374151">报表与看板</text>
</svg>