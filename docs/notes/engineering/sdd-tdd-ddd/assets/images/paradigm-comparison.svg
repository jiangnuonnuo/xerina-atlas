<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <rect width="1060" height="640" fill="#ffffff"/>
  <text x="530" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">四种开发姿势：把代价摆到桌面上</text>
  <text x="530" y="68" text-anchor="middle" font-size="13" fill="#6b7280">不是谁取代谁，而是你的项目活多久、谁来维护</text>
  <rect x="30" y="96" width="1010" height="52" rx="8" fill="#111827"/>
  <text x="287.5" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Vibe Coding</text>
  <text x="502.5" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">只有 DDD</text>
  <text x="717.5" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">SDD + TDD</text>
  <text x="932.5" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">DDD + SDD + TDD</text>
  <rect x="30" y="148" width="1010" height="50" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="46" y="178" font-size="13.5" font-weight="600" fill="#111827">上手速度</text>
  <rect x="180" y="154" width="215" height="38" fill="#fef2f2"/>
  <text x="287.5" y="179" text-anchor="middle" font-size="12" fill="#374151">几分钟出 Demo</text>
  <rect x="395" y="154" width="215" height="38" fill="#eff6ff"/>
  <text x="502.5" y="179" text-anchor="middle" font-size="12" fill="#374151">慢，要先建模</text>
  <rect x="610" y="154" width="215" height="38" fill="#faf5ff"/>
  <text x="717.5" y="179" text-anchor="middle" font-size="12" fill="#374151">中，要先写契约</text>
  <rect x="825" y="154" width="215" height="38" fill="#f0fdf4"/>
  <text x="932.5" y="179" text-anchor="middle" font-size="12" fill="#374151">最慢，先建模再写契约</text>
  <rect x="30" y="198" width="1010" height="50" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="46" y="228" font-size="13.5" font-weight="600" fill="#111827">需求变化</text>
  <rect x="180" y="204" width="215" height="38" fill="#fef2f2"/>
  <text x="287.5" y="229" text-anchor="middle" font-size="12" fill="#374151">改不动，越改越乱</text>
  <rect x="395" y="204" width="215" height="38" fill="#eff6ff"/>
  <text x="502.5" y="229" text-anchor="middle" font-size="12" fill="#374151">能改，边界清楚</text>
  <rect x="610" y="204" width="215" height="38" fill="#faf5ff"/>
  <text x="717.5" y="229" text-anchor="middle" font-size="12" fill="#374151">能改，先改 spec 再改代码</text>
  <rect x="825" y="204" width="215" height="38" fill="#f0fdf4"/>
  <text x="932.5" y="229" text-anchor="middle" font-size="12" fill="#374151">能改，改哪块地很清楚</text>
  <rect x="30" y="248" width="1010" height="50" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="46" y="278" font-size="13.5" font-weight="600" fill="#111827">AI 可控性</text>
  <rect x="180" y="254" width="215" height="38" fill="#fef2f2"/>
  <text x="287.5" y="279" text-anchor="middle" font-size="12" fill="#374151">完全靠手感</text>
  <rect x="395" y="254" width="215" height="38" fill="#eff6ff"/>
  <text x="502.5" y="279" text-anchor="middle" font-size="12" fill="#374151">有边界没合同</text>
  <rect x="610" y="254" width="215" height="38" fill="#faf5ff"/>
  <text x="717.5" y="279" text-anchor="middle" font-size="12" fill="#374151">有合同，AI 跑不偏</text>
  <rect x="825" y="254" width="215" height="38" fill="#f0fdf4"/>
  <text x="932.5" y="279" text-anchor="middle" font-size="12" fill="#374151">边界 + 合同 + 验收三层护栏</text>
  <rect x="30" y="298" width="1010" height="50" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="46" y="328" font-size="13.5" font-weight="600" fill="#111827">质量兜底</text>
  <rect x="180" y="304" width="215" height="38" fill="#fef2f2"/>
  <text x="287.5" y="329" text-anchor="middle" font-size="12" fill="#374151">靠人眼 review</text>
  <rect x="395" y="304" width="215" height="38" fill="#eff6ff"/>
  <text x="502.5" y="329" text-anchor="middle" font-size="12" fill="#374151">设计好但测试未必有</text>
  <rect x="610" y="304" width="215" height="38" fill="#faf5ff"/>
  <text x="717.5" y="329" text-anchor="middle" font-size="12" fill="#374151">测试先行，回归可发现</text>
  <rect x="825" y="304" width="215" height="38" fill="#f0fdf4"/>
  <text x="932.5" y="329" text-anchor="middle" font-size="12" fill="#374151">设计、契约、测试三重兜底</text>
  <rect x="30" y="348" width="1010" height="50" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="46" y="378" font-size="13.5" font-weight="600" fill="#111827">新人接手</text>
  <rect x="180" y="354" width="215" height="38" fill="#fef2f2"/>
  <text x="287.5" y="379" text-anchor="middle" font-size="12" fill="#374151">只能重写</text>
  <rect x="395" y="354" width="215" height="38" fill="#eff6ff"/>
  <text x="502.5" y="379" text-anchor="middle" font-size="12" fill="#374151">看领域模型能懂一半</text>
  <rect x="610" y="354" width="215" height="38" fill="#faf5ff"/>
  <text x="717.5" y="379" text-anchor="middle" font-size="12" fill="#374151">看 spec 能懂行为</text>
  <rect x="825" y="354" width="215" height="38" fill="#f0fdf4"/>
  <text x="932.5" y="379" text-anchor="middle" font-size="12" fill="#374151">看 spec + 领域模型就懂</text>
  <rect x="30" y="398" width="1010" height="50" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="46" y="428" font-size="13.5" font-weight="600" fill="#111827">适合场景</text>
  <rect x="180" y="404" width="215" height="38" fill="#fef2f2"/>
  <text x="287.5" y="429" text-anchor="middle" font-size="12" fill="#374151">Demo / 一次性脚本</text>
  <rect x="395" y="404" width="215" height="38" fill="#eff6ff"/>
  <text x="502.5" y="429" text-anchor="middle" font-size="12" fill="#374151">业务复杂的大单体</text>
  <rect x="610" y="404" width="215" height="38" fill="#faf5ff"/>
  <text x="717.5" y="429" text-anchor="middle" font-size="12" fill="#374151">接口明确的平台与工具</text>
  <rect x="825" y="404" width="215" height="38" fill="#f0fdf4"/>
  <text x="932.5" y="429" text-anchor="middle" font-size="12" fill="#374151">要长期演进的核心系统</text>
  <rect x="30" y="448" width="1010" height="50" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="46" y="478" font-size="13.5" font-weight="600" fill="#dc2626">典型翻车</text>
  <rect x="180" y="454" width="215" height="38" fill="#fef2f2"/>
  <text x="287.5" y="479" text-anchor="middle" font-size="12" fill="#374151">半年后不敢改</text>
  <rect x="395" y="454" width="215" height="38" fill="#eff6ff"/>
  <text x="502.5" y="479" text-anchor="middle" font-size="12" fill="#374151">文档和代码对不上</text>
  <rect x="610" y="454" width="215" height="38" fill="#faf5ff"/>
  <text x="717.5" y="479" text-anchor="middle" font-size="12" fill="#374151">spec 没人维护变废纸</text>
  <rect x="825" y="454" width="215" height="38" fill="#f0fdf4"/>
  <text x="932.5" y="479" text-anchor="middle" font-size="12" fill="#374151">仪式过重，小需求也走全套</text>
  <rect x="30" y="518" width="1000" height="72" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="54" y="544" font-size="13.5" font-weight="600" fill="#111827">怎么选：看项目预期寿命，不看团队心情</text>
  <text x="54" y="568" font-size="12.5" fill="#374151">活不过两周的东西，Vibe Coding 是最优解；要活两年、要换三拨人维护的系统，请把三件套配齐。</text>
  <text x="54" y="586" font-size="12.5" fill="#6b7280">折中做法：核心域上三件套，边缘脚本该糊就糊 —— 怕的是全项目一个标准。</text>
</svg>