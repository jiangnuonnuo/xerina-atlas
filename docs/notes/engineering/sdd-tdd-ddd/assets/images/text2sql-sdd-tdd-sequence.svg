<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 780" width="1080" height="780">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#15803d"/>
    </marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c2410c"/>
    </marker>
    <marker id="agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1080" height="780" fill="#ffffff"/>
  <text x="540" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">实战第 2、3 步 · 一个功能的 SDD + TDD 全流程</text>
  <text x="540" y="66" text-anchor="middle" font-size="13" fill="#6b7280">以「查询意图解析」为例：先立合同，再立规矩，最后才让 AI 动手</text>
  <line x1="110" y1="138" x2="110" y2="596" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6,5"/>
  <rect x="44" y="92" width="132" height="42" rx="8" fill="#111827"/>
  <text x="110" y="119" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">人（你）</text>
  <line x1="310" y1="138" x2="310" y2="596" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6,5"/>
  <rect x="244" y="92" width="132" height="42" rx="8" fill="#7c3aed"/>
  <text x="310" y="119" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">Spec 规格</text>
  <line x1="510" y1="138" x2="510" y2="596" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6,5"/>
  <rect x="444" y="92" width="132" height="42" rx="8" fill="#15803d"/>
  <text x="510" y="119" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">Test 测试</text>
  <line x1="710" y1="138" x2="710" y2="596" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6,5"/>
  <rect x="644" y="92" width="132" height="42" rx="8" fill="#c2410c"/>
  <text x="710" y="119" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">AI Agent</text>
  <line x1="910" y1="138" x2="910" y2="596" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6,5"/>
  <rect x="844" y="92" width="132" height="42" rx="8" fill="#1d4ed8"/>
  <text x="910" y="119" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">CI 校验</text>
  <line x1="114" y1="170" x2="300" y2="170" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="210" y="161" text-anchor="middle" font-size="12.5" fill="#374151">写意图解析的输入输出契约（时间、维度、指标、过滤、对比）</text>
  <line x1="314" y1="222" x2="500" y2="222" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="410" y="213" text-anchor="middle" font-size="12.5" fill="#374151">据契约推导验收场景清单（AI 起草）</text>
  <line x1="114" y1="274" x2="500" y2="274" stroke="#111827" stroke-width="1.8" marker-end="url(#agr)"/>
  <text x="310" y="265" text-anchor="middle" font-size="12.5" fill="#374151">人工补边界：时间歧义、指标未注册、跨库引用</text>
  <line x1="514" y1="326" x2="700" y2="326" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="610" y="317" text-anchor="middle" font-size="12.5" fill="#374151">红灯：先跑一次，全部失败</text>
  <path d="M 710 378 l 50 0 l 0 26 l -50 0" fill="none" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="770" y="400" font-size="12.5" fill="#374151">AI 实现 parseIntent()，只准用契约里出现过的字段</text>
  <line x1="706" y1="430" x2="520" y2="430" stroke="#15803d" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="610" y="421" text-anchor="middle" font-size="12.5" fill="#374151">绿灯：9 条用例全过</text>
  <line x1="706" y1="482" x2="320" y2="482" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="510" y="473" text-anchor="middle" font-size="12.5" fill="#374151">发现契约缺失 → 回写 spec，不许改测试凑实现</text>
  <line x1="714" y1="534" x2="900" y2="534" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="810" y="525" text-anchor="middle" font-size="12.5" fill="#374151">提交：跑全量测试 + 安全校验 + 架构规则</text>
  <line x1="906" y1="586" x2="120" y2="586" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="510" y="577" text-anchor="middle" font-size="12.5" fill="#374151">验证报告：通过项、缺失项、需人工确认项</text>
  <rect x="40" y="612" width="1000" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="540" y="640" text-anchor="middle" font-size="12.5" fill="#15803d">结果：这一步人花 25 分钟写契约和补边界，AI 花 6 分钟实现并跑绿，返工 0 次</text>
  <rect x="40" y="674" width="1000" height="90" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="62" y="700" font-size="13" font-weight="600" fill="#dc2626">写进宪法的安全红线（不是写进代码注释）</text>
  <text x="62" y="724" font-size="12.5" fill="#991b1b">· 只放行 SELECT，DDL / DML 一律拒绝</text>
  <text x="400" y="724" font-size="12.5" fill="#991b1b">· 未绑定成功的字段不许拼进 SQL</text>
  <text x="700" y="724" font-size="12.5" fill="#991b1b">· 时间口径有歧义必须先澄清，不许猜</text>
  <text x="62" y="748" font-size="12.5" fill="#991b1b">· 同一会话内不许静默切换数据源</text>
  <text x="400" y="748" font-size="12.5" fill="#991b1b">· 结论必须能回溯到具体 SQL 与字段</text>
</svg>