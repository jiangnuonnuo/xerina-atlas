<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 730" width="1060" height="730">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c2410c"/>
    </marker>
    <marker id="agr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1060" height="730" fill="#ffffff"/>
  <text x="530" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">三件套的接力顺序：先划地盘，再签合同，最后立规矩</text>
  <text x="530" y="68" text-anchor="middle" font-size="13" fill="#6b7280">顺序错了，后面每一步都要返工</text>
  <rect x="110" y="100" width="820" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="110" y="100" width="72" height="112" rx="10" fill="#1d4ed8"/>
  <rect x="146" y="100" width="36" height="112" fill="#1d4ed8"/>
  <text x="146" y="166" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">DDD</text>
  <rect x="852" y="116" width="62" height="26" rx="13" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="883" y="133" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d4ed8">人主导</text>
  <text x="200" y="132" font-size="15" font-weight="600" fill="#111827">第 1 棒：业务建模</text>
  <text x="200" y="156" font-size="12.5" fill="#374151">业务边界在哪？术语怎么统一？</text>
  <text x="200" y="182" font-size="12" fill="#6b7280">产出：限界上下文、领域模型、统一语言、聚合根</text>
  <text x="200" y="202" font-size="11.5" fill="#1d4ed8">没有这一步，AI 会把所有规则塞进一个 Service</text>
  <rect x="110" y="228" width="820" height="112" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <rect x="110" y="228" width="72" height="112" rx="10" fill="#7c3aed"/>
  <rect x="146" y="228" width="36" height="112" fill="#7c3aed"/>
  <text x="146" y="294" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">SDD</text>
  <rect x="852" y="244" width="62" height="26" rx="13" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="883" y="261" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7c3aed">人主导</text>
  <text x="200" y="260" font-size="15" font-weight="600" fill="#111827">第 2 棒：写规格</text>
  <text x="200" y="284" font-size="12.5" fill="#374151">输入是什么？输出是什么？什么情况必须失败？</text>
  <text x="200" y="310" font-size="12" fill="#6b7280">产出：接口契约、状态机、不变量、禁止行为、验收标准</text>
  <text x="200" y="330" font-size="11.5" fill="#7c3aed">没有这一步，AI 只能猜，猜错了你也不好验收</text>
  <rect x="110" y="356" width="820" height="112" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="110" y="356" width="72" height="112" rx="10" fill="#15803d"/>
  <rect x="146" y="356" width="36" height="112" fill="#15803d"/>
  <text x="146" y="422" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">TDD</text>
  <rect x="852" y="372" width="62" height="26" rx="13" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="883" y="389" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15803d">人把关</text>
  <text x="200" y="388" font-size="15" font-weight="600" fill="#111827">第 3 棒：写测试</text>
  <text x="200" y="412" font-size="12.5" fill="#374151">凭什么说做对了？回归了谁能发现？</text>
  <text x="200" y="438" font-size="12" fill="#6b7280">产出：先红的测试用例、断言、回归套件</text>
  <text x="200" y="458" font-size="11.5" fill="#15803d">没有这一步，spec 只是一份没人验证的文档</text>
  <rect x="110" y="484" width="820" height="112" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="110" y="484" width="72" height="112" rx="10" fill="#c2410c"/>
  <rect x="146" y="484" width="36" height="112" fill="#c2410c"/>
  <text x="146" y="550" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">AI</text>
  <rect x="852" y="500" width="62" height="26" rx="13" fill="#ffffff" stroke="#c2410c" stroke-width="1.2"/>
  <text x="883" y="517" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c2410c">AI 主导</text>
  <text x="200" y="516" font-size="15" font-weight="600" fill="#111827">第 4 棒：AI 实现</text>
  <text x="200" y="540" font-size="12.5" fill="#374151">在边界内、按合同、过测试地写代码</text>
  <text x="200" y="566" font-size="12" fill="#6b7280">产出：实现代码 + 重构后的结构 + 验证报告</text>
  <text x="200" y="586" font-size="11.5" fill="#c2410c">这一步最便宜，也最应该交给机器</text>
  <line x1="500" y1="212" x2="500" y2="226" stroke="#9ca3af" stroke-width="2" marker-end="url(#agr)"/>
  <line x1="500" y1="340" x2="500" y2="354" stroke="#9ca3af" stroke-width="2" marker-end="url(#agr)"/>
  <line x1="500" y1="468" x2="500" y2="482" stroke="#9ca3af" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M 930 540 L 968 540 L 968 156 L 930 156" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-dasharray="7,4" marker-end="url(#ao)"/>
  <text x="994" y="348" font-size="12" font-weight="600" fill="#dc2626" transform="rotate(-90 994 348)">验证不通过 → 回写规格与测试</text>
  <rect x="40" y="626" width="980" height="72" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="530" y="654" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">一句话记住这条链路</text>
  <text x="530" y="680" text-anchor="middle" font-size="12.5" fill="#6b7280">DDD 决定「有几块地」，SDD 决定「每块地的合同怎么写」，TDD 决定「合同有没有被履行」，AI 决定「砖怎么砌」</text>
</svg>