<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">archive 一次操作，产出两条路线</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">同一份变更文件夹，被「合并」成基线、又被「原样复制」成档案</text>

  <rect x="300" y="86" width="360" height="96" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">changes/&lt;name&gt;/  活跃变更</text>
  <text x="480" y="137" text-anchor="middle" font-size="12" fill="#6b7280">proposal · design · tasks</text>
  <text x="480" y="157" text-anchor="middle" font-size="12" fill="#6b7280">specs/(delta) · evidence</text>

  <rect x="360" y="214" width="240" height="60" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="480" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">archive 命令</text>
  <text x="480" y="258" text-anchor="middle" font-size="11" fill="#d1d5db">一次操作 · 两个产出</text>

  <line x1="480" y1="182" x2="480" y2="212" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <path d="M445,274 C 410,300 270,300 235,318" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M515,274 C 550,300 690,300 725,318" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <rect x="40" y="320" width="380" height="210" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="60" y="348" font-size="14" font-weight="600" fill="#1d4ed8">路线①  合并进 specs/（冻结基线）</text>
  <text x="60" y="378" font-size="12.5" fill="#374151">1. 抽取 delta 规范</text>
  <text x="60" y="400" font-size="12.5" fill="#374151">   ADDED / MODIFIED / REMOVED / RENAMED</text>
  <text x="60" y="426" font-size="12.5" fill="#374151">2. 剥离 delta 动词</text>
  <text x="60" y="448" font-size="12.5" fill="#374151">   只留 Requirement + Scenario + WHEN/THEN</text>
  <text x="60" y="474" font-size="12.5" fill="#374151">3. 精准缝进 specs/&lt;cap&gt;/spec.md</text>
  <text x="60" y="502" font-size="12" font-weight="600" fill="#1d4ed8">→ 系统「现在应当怎样」的纯净事实来源</text>
  <text x="60" y="522" font-size="11" fill="#6b7280">（机器消费：AI 编码 / 测试 / 校验的契约）</text>

  <rect x="540" y="320" width="380" height="210" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="560" y="348" font-size="14" font-weight="600" fill="#15803d">路线②  搬入 archive/（审计轨迹）</text>
  <text x="560" y="378" font-size="12.5" fill="#374151">1. 整个 changes/&lt;name&gt;/ 原样复制</text>
  <text x="560" y="400" font-size="12.5" fill="#374151">   保留 proposal / design / tasks</text>
  <text x="560" y="422" font-size="12.5" fill="#374151">   specs(delta) / evidence</text>
  <text x="560" y="448" font-size="12.5" fill="#374151">2. 路径：changes/archive/</text>
  <text x="560" y="470" font-size="12.5" fill="#374151">   YYYY-MM-DD-&lt;name&gt;/</text>
  <text x="560" y="502" font-size="12" font-weight="600" fill="#15803d">→ 每次变更的「决策理由+过程+证据」全留痕</text>
  <text x="560" y="522" font-size="11" fill="#6b7280">（人消费：审计 / 追溯 / 接手 / 回滚）</text>

  <rect x="40" y="556" width="880" height="104" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="582" font-size="13" font-weight="600" fill="#111827">为什么两者都要存在？</text>
  <text x="60" y="606" font-size="12.5" fill="#374151">specs/ 是「结论」：永远只显示当前态，旧值被覆盖即消失——回答「现在该照做什么」。</text>
  <text x="60" y="628" font-size="12.5" fill="#374151">archive/ 是「全过程」：原样封存 delta 与决策理由——回答「过去每次是怎么定的、凭什么」。</text>
  <text x="60" y="650" font-size="12.5" fill="#374151">合并会「吃掉」过程信息，故档案必须原样留底；两者缺一，规范驱动即不可审计。</text>

  <g transform="translate(706,96)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="34" y="12" font-size="12" fill="#6b7280">合并为基线</text>
    <line x1="0" y1="28" x2="28" y2="28" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="34" y="32" font-size="12" fill="#6b7280">原样归档</text>
  </g>
</svg>