<svg xmlns="http://www.w3.org/2000/svg" width="2360" height="1640" viewBox="0 0 1180 820">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;}</style>
<defs>
<marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
</defs>
<rect width="1180" height="820" fill="#ffffff"/>
<text x="570" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">OpenSpec 核心开发循环：7 步规范驱动工作流</text>
<rect x="104" y="84" width="6" height="66" rx="3" fill="#2563eb"/>
<rect x="110" y="84" width="642" height="66" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="70" cy="117.0" r="20" fill="#2563eb"/>
<text x="70" y="123.0" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
<text x="128" y="112" font-size="15" font-weight="700" fill="#111827">提案 · Propose</text>
<text x="128" y="134" font-size="11" fill="#6b7280">产出 proposal.md：为什么做、动什么、不碰什么（Non-Goals 锁边界）</text>
<line x1="428" y1="150" x2="428" y2="180" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="104" y="180" width="6" height="66" rx="3" fill="#2563eb"/>
<rect x="110" y="180" width="642" height="66" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="70" cy="213.0" r="20" fill="#2563eb"/>
<text x="70" y="219.0" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
<text x="128" y="208" font-size="15" font-weight="700" fill="#111827">规范 · Spec</text>
<text x="128" y="230" font-size="11" fill="#6b7280">产出 specs/&lt;cap&gt;/spec.md：系统“应当 SHALL”怎样，用 WHEN/THEN 场景描述</text>
<line x1="428" y1="246" x2="428" y2="276" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="104" y="276" width="6" height="66" rx="3" fill="#2563eb"/>
<rect x="110" y="276" width="642" height="66" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="70" cy="309.0" r="20" fill="#2563eb"/>
<text x="70" y="315.0" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
<text x="128" y="304" font-size="15" font-weight="700" fill="#111827">设计 · Design</text>
<text x="128" y="326" font-size="11" fill="#6b7280">产出 design.md：数据模型、运行时流程、分层边界、风险</text>
<line x1="428" y1="342" x2="428" y2="372" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="104" y="372" width="6" height="66" rx="3" fill="#2563eb"/>
<rect x="110" y="372" width="642" height="66" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="70" cy="405.0" r="20" fill="#2563eb"/>
<text x="70" y="411.0" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
<text x="128" y="400" font-size="15" font-weight="700" fill="#111827">任务 · Tasks</text>
<text x="128" y="422" font-size="11" fill="#6b7280">产出 tasks.md：把设计拆成可勾选的小步（TDD）</text>
<line x1="428" y1="438" x2="428" y2="468" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="104" y="468" width="6" height="66" rx="3" fill="#2563eb"/>
<rect x="110" y="468" width="642" height="66" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="70" cy="501.0" r="20" fill="#2563eb"/>
<text x="70" y="507.0" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
<text x="128" y="496" font-size="15" font-weight="700" fill="#111827">实施 · Apply</text>
<text x="128" y="518" font-size="11" fill="#6b7280">AI 按 tasks.md 写代码 + 测试，逐个勾选 [x]</text>
<line x1="428" y1="534" x2="428" y2="564" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="104" y="564" width="6" height="66" rx="3" fill="#2563eb"/>
<rect x="110" y="564" width="642" height="66" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="70" cy="597.0" r="20" fill="#2563eb"/>
<text x="70" y="603.0" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text>
<text x="128" y="592" font-size="15" font-weight="700" fill="#111827">验证 · Verify</text>
<text x="128" y="614" font-size="11" fill="#6b7280">跑测试，确认代码满足 specs 里的 WHEN/THEN</text>
<line x1="428" y1="630" x2="428" y2="660" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="104" y="660" width="6" height="66" rx="3" fill="#2563eb"/>
<rect x="110" y="660" width="642" height="66" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="70" cy="693.0" r="20" fill="#2563eb"/>
<text x="70" y="699.0" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text>
<text x="128" y="688" font-size="15" font-weight="700" fill="#111827">归档 · Archive</text>
<text x="128" y="710" font-size="11" fill="#6b7280">把 delta 规范“提升”为项目基线，变更移入 archive/</text>
<path d="M 752 693 L 990 693 L 990 117 L 752 117" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#a-purple)"/>
<text x="1002" y="403" font-size="12" fill="#9333ea" font-weight="600">循环：基于冻结基线 specs/</text>
<text x="1002" y="421" font-size="12" fill="#9333ea" font-weight="600">开启下一次变更</text>
<line x1="70" y1="762" x2="98" y2="762" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="106" y="766" font-size="12" fill="#6b7280">顺序流转（propose → … → archive）</text>
<line x1="360" y1="762" x2="388" y2="762" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#a-purple)"/>
<text x="396" y="766" font-size="12" fill="#6b7280">闭环：归档后的基线成为下一轮变更的“事实来源”</text>
</svg>