server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # walicode-server（AI-SSH-Agent 后端）同源反代：浏览器 -> nginx(:80) -> 后端
    # 容器需加入 docker 网络 walicode-frontnet（deploy.sh 自动创建并挂载），
    # 由 Docker 内嵌 DNS 解析服务名 app（walicode 的 app 容器同样在此网络上）。
    # NDJSON/SSE 流式输出需关闭缓冲并拉长读写超时。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $walicode_upstream http://app:8091;
        proxy_pass $walicode_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # HTML 文档每次回源校验 (ETag/Last-Modified), 保证发版后浏览器立即拿到新页面
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}

